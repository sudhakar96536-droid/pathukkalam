body{

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://jxpvkamxtedgzztozonl.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_DCI0qvAlYNWi8DZkZF2g_frSEW_OX";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   GLOBALS
========================================================= */

let currentUser = null;
let currentProfile = null;

let allReels = [];

let selectedFile = null;
let sourceUrl = null;

let cropRatio = "original";

let cropX = 0;
let cropY = 0;

let zoom = 1;

let trimStart = 0;
let trimEnd = 30;

let exportedBlob = null;

let exportedMime =
    "video/webm";


/* =========================================================
   ELEMENTS
========================================================= */

const feed =
    document.getElementById("feed");

const uploadPanel =
    document.getElementById("uploadPanel");

const dashboard =
    document.getElementById("dashboard");

const sourceVideo =
    document.getElementById("sourceVideo");

const cropOverlay =
    document.getElementById("cropOverlay");

const videoFile =
    document.getElementById("videoFile");

const startRange =
    document.getElementById("startRange");

const endRange =
    document.getElementById("endRange");

const trimLabel =
    document.getElementById("trimLabel");

const exportProgress =
    document.getElementById("exportProgress");


/* =========================================================
   TOAST
========================================================= */

function toast(message){

    const el =
        document.getElementById("toast");

    el.innerText =
        message;

    el.classList.add("show");

    setTimeout(
        () => el.classList.remove("show"),
        3000
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


/* =========================================================
   FORMAT
========================================================= */

function formatCount(number){

    number =
        Number(number || 0);

    if(number >= 1000000)
        return (
            (number / 1000000)
                .toFixed(1)
                .replace(".0","") +
            "M"
        );

    if(number >= 1000)
        return (
            (number / 1000)
                .toFixed(1)
                .replace(".0","") +
            "K"
        );

    return String(number);

}


/* =========================================================
   CURRENT USER
========================================================= */

async function loadCurrentUser(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(error || !data.user){

        window.location.href =
            "/login";

        return false;

    }


    currentUser =
        data.user;


    const {
        data:profile
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            name,
            profile_url
        `)
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    currentProfile =
        profile;


    return true;

}


/* =========================================================
   LOAD REELS
========================================================= */

async function loadReels(){

    feed.innerHTML = `

        <div class="loading">

            <i class="fas fa-spinner fa-spin"></i>

            <div>
                Loading Reels...
            </div>

        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("reels")
        .select(`
            id,
            user_id,
            video_url,
            caption,
            hashtags,
            duration_seconds,
            crop_ratio,
            views_count,
            likes_count,
            comments_count,
            shares_count,
            whatsapp_clicks_count,
            created_at
        `)
        .eq(
            "status",
            "active"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        feed.innerHTML = `

            <div class="empty">
                Unable to load Reels.
                <br><br>
                ${escapeHtml(error.message)}
            </div>

        `;

        return;

    }


    allReels =
        data || [];


    await attachProfiles();

}


/* =========================================================
   ATTACH PROFILES
========================================================= */

async function attachProfiles(){

    const ids =
        [
            ...new Set(
                allReels
                    .map(
                        r => r.user_id
                    )
            )
        ];


    if(!ids.length){

        renderFeed();

        return;

    }


    const {
        data:profiles
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            name,
            profile_url
        `)
        .in(
            "id",
            ids
        );


    const map =
        new Map();


    (profiles || [])
        .forEach(
            p =>
                map.set(
                    p.id,
                    p
                )
        );


    allReels =
        allReels.map(
            reel => ({

                ...reel,

                profile:
                    map.get(
                        reel.user_id
                    ) || null

            })
        );


    renderFeed();

}


/* =========================================================
   RENDER FEED
========================================================= */

function renderFeed(){

    feed.innerHTML = "";


    if(!allReels.length){

        feed.innerHTML = `

            <div class="empty">

                🎬

                <br><br>

                No Reels yet.

                <br><br>

                Be the first to upload!

            </div>

        `;

        return;

    }


    allReels.forEach(
        reel => {

            feed.appendChild(
                createReelCard(reel)
            );

        }
    );

}


/* =========================================================
   CREATE REEL
========================================================= */

function createReelCard(reel){

    const card =
        document.createElement("div");

    card.className =
        "reel-card";


    const profile =
        reel.profile;


    const avatar =
        profile?.profile_url ||
        "https://i.pravatar.cc/100";


    const name =
        profile?.name ||
        profile?.username ||
        "Pathukkalam User";


    const username =
        profile?.username ||
        "user";


    const hashtags =
        (reel.hashtags || [])
            .map(
                h =>
                    h.startsWith("#")
                        ? h
                        : "#" + h
            )
            .join(" ");


    card.innerHTML = `

        <video
            class="reel-video"
            src="${escapeHtml(reel.video_url)}"
            playsinline
            controls
            preload="metadata">
        </video>


        <div class="reel-info">

            <div class="poster-row">

                <img
                    class="poster-avatar"
                    src="${escapeHtml(avatar)}">

                <div>

                    <div class="poster-name">

                        ${escapeHtml(name)}

                    </div>

                    <div class="poster-username">

                        @${escapeHtml(username)}

                    </div>

                </div>


                <button
                    class="profile-btn">

                    Profile

                </button>

            </div>


            ${
                reel.caption
                    ? `
                        <div class="caption">
                            ${escapeHtml(
                                reel.caption
                            )}
                        </div>
                      `
                    : ""
            }


            ${
                hashtags
                    ? `
                        <div class="hashtags">
                            ${escapeHtml(
                                hashtags
                            )}
                        </div>
                      `
                    : ""
            }


            <div class="stats">

                <span>
                    👁 ${formatCount(
                        reel.views_count
                    )}
                </span>

                <span>
                    ❤️ ${formatCount(
                        reel.likes_count
                    )}
                </span>

                <span>
                    💬 ${formatCount(
                        reel.comments_count
                    )}
                </span>

                <span>
                    ↗ ${formatCount(
                        reel.shares_count
                    )}
                </span>

            </div>


            <div class="reel-actions">

                <button
                    class="action-btn"
                    data-action="like">

                    ❤️ Like

                </button>


                <button
                    class="action-btn"
                    data-action="comment">

                    💬 Comment

                </button>


                <button
                    class="action-btn share"
                    data-action="share">

                    ↗ Share

                </button>


                <button
                    class="action-btn whatsapp"
                    data-action="whatsapp">

                    <i class="fab fa-whatsapp"></i>

                </button>

            </div>


            <div class="comments">

                <div class="comment-input">

                    <input
                        type="text"
                        placeholder="Write a comment...">

                    <button>
                        Send
                    </button>

                </div>


                <div class="comment-list">

                </div>

            </div>

        </div>

    `;


    /* =====================================================
       VIEW COUNT
    ===================================================== */

    const video =
        card.querySelector(
            ".reel-video"
        );


    let viewRecorded = false;


    video.addEventListener(
        "play",
        async function(){

            if(viewRecorded)
                return;

            viewRecorded = true;

            await recordView(
                reel
            );

        }
    );


    /* =====================================================
       LIKE
    ===================================================== */

    const likeBtn =
        card.querySelector(
            '[data-action="like"]'
        );

async function toggleLike(

        .select("id")
        .eq(
            "reel_id",
            reel.id

            );

            reel.id,

            "liked"

/* =========================================================
   COMMENTS
========================================================= */

async function loadComments(
    reel,
    commentsBox
){

    const list =
        commentsBox.querySelector(
            ".comment-list"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("reel_comments")
        .select(`
            id,
            user_id,
            comment,
            created_at
        `)
        .eq(
            "reel_id",
            reel.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        list.innerHTML =
            "Unable to load comments.";

        return;

    }


    if(!data?.length){

        list.innerHTML =
            '<div style="color:#777;font-size:12px;">No comments yet.</div>';

        return;

    }


    list.innerHTML = "";


    const ids =
        [
            ...new Set(
                data.map(
                    c => c.user_id
                )
            )
        ];


    const {
        data:profiles
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            name
        `)
        .in(
            "id",
            ids
        );


    const map =
        new Map();


    (profiles || [])
        .forEach(
            p =>
                map.set(
                    p.id,
                    p
                )
        );


    data.forEach(
        comment => {

            const p =
                map.get(
                    comment.user_id
                );


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "comment-item";


            item.innerHTML = `

                <b>
                    ${escapeHtml(
                        p?.name ||
                        p?.username ||
                        "User"
                    )}
                </b>

                <br>

                ${escapeHtml(
                    comment.comment
                )}

            `;


            list.appendChild(
                item
            );

        }
    );

}

/* =========================================================
   COUNTER
========================================================= */

async function incrementReelCounter(
    reelId,
    column
){

    const {
        data
    } =
    await supabaseClient
        .from("reels")
        .select(column)
        .eq(
            "id",
            reelId
        )
        .single();


    if(!data)
        return;


    const value =
        Number(
            data[column] || 0
        );


    await supabaseClient
        .from("reels")
        .update({

            [column]:
                value + 1

        })
        .eq(
            "id",
            reelId
        );

}


async function decrementReelCounter(
    reelId,
    column
){

    const {
        data
    } =
    await supabaseClient
        .from("reels")
        .select(column)
        .eq(
            "id",
            reelId
        )
        .single();


    if(!data)
        return;


    const value =
        Math.max(
            0,
            Number(
                data[column] || 0
            ) - 1
        );


    await supabaseClient
        .from("reels")
        .update({

            [column]:
                value

        })
        .eq(
            "id",
            reelId
        );

}

/* =========================================================
   CROP OVERLAY
========================================================= */

function getRatio(){

    if(cropRatio === "9:16")
        return 9 / 16;

    if(cropRatio === "1:1")
        return 1;

    if(cropRatio === "4:5")
        return 4 / 5;

    if(cropRatio === "16:9")
        return 16 / 9;

    return null;

}


function updateCropOverlay(){

    const wrap =
        document.querySelector(
            ".editor-video-wrap"
        );


    if(!sourceVideo.videoWidth){

        return;

    }


    const videoRatio =
        sourceVideo.videoWidth /
        sourceVideo.videoHeight;


    const ratio =
        getRatio();


    let width =
        wrap.clientWidth;


    let height =
        width /
        videoRatio;


    if(
        ratio &&
        ratio < videoRatio
    ){

        width =
            height *
            ratio;

    }
    else if(
        ratio
    ){

        height =
            width /
            ratio;

    }


    const maxWidth =
        wrap.clientWidth;


    const maxHeight =
        sourceVideo.clientHeight;


    width =
        Math.min(
            width,
            maxWidth
        );


    height =
        Math.min(
            height,
            maxHeight
        );


    cropOverlay.style.width =
        width + "px";

    cropOverlay.style.height =
        height + "px";

    cropOverlay.style.left =
        (
            (maxWidth - width) / 2
        ) + "px";

    cropOverlay.style.top =
        (
            (maxHeight - height) / 2
        ) + "px";

}

/* =========================================================
   REAL VIDEO PROCESSOR
========================================================= */

async function exportProcessedVideo(){

    exportProgress.style.display =
        "block";


    exportProgress.innerText =
        "Preparing video processor...";


    const canvas =
        document.createElement(
            "canvas"
        );


    const videoWidth =
        sourceVideo.videoWidth;

    const videoHeight =
        sourceVideo.videoHeight;


    const ratio =
        getRatio();


    let cropWidth =
        videoWidth;

    let cropHeight =
        videoHeight;


    if(ratio){

        if(
            videoWidth /
            videoHeight >
            ratio
        ){

            cropHeight =
                videoHeight;

            cropWidth =
                cropHeight *
                ratio;

        }
        else{

            cropWidth =
                videoWidth;

            cropHeight =
                cropWidth /
                ratio;

        }

    }


    cropWidth =
        Math.floor(
            cropWidth
        );

    cropHeight =
        Math.floor(
            cropHeight
        );


    /*
       Keep output manageable.
    */

    const maxOutput =
        720;


    let outputWidth =
        cropWidth;

    let outputHeight =
        cropHeight;


    if(
        outputWidth >
        maxOutput
    ){

        const scale =
            maxOutput /
            outputWidth;

        outputWidth =
            Math.floor(
                outputWidth *
                scale
            );

        outputHeight =
            Math.floor(
                outputHeight *
                scale
            );

    }


    canvas.width =
        outputWidth;

    canvas.height =
        outputHeight;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const stream =
        canvas.captureStream(
            30
        );


    /*
       Add audio from the video
       when browser supports it.
    */

    try{

        if(
            typeof sourceVideo.captureStream ===
            "function"
        ){

            const videoStream =
                sourceVideo.captureStream();


            videoStream
                .getAudioTracks()
                .forEach(
                    track =>
                        stream.addTrack(
                            track
                        )
                );

        }

    }
    catch(error){

        console.warn(
            "Audio capture unavailable",
            error
        );

    }


    const mimeTypes = [

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm"

    ];


    let mimeType = "";


    for(
        const type
        of mimeTypes
    ){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            mimeType =
                type;

            break;

        }

    }


    if(!mimeType){

        throw new Error(
            "This browser does not support video recording."
        );

    }


    exportedMime =
        mimeType;


    const recorder =
        new MediaRecorder(
            stream,
            {
                mimeType
            }
        );


    const chunks = [];


    recorder.ondataavailable =
        event => {

            if(
                event.data &&
                event.data.size
            ){

                chunks.push(
                    event.data
                );

            }

        };


    const finished =
        new Promise(
            (resolve,reject) => {

                recorder.onerror =
                    reject;

                recorder.onstop =
                    resolve;

            }
        );


    /*
       Determine crop position.
       Current default is center crop.
    */

    const sx =
        Math.max(
            0,
            Math.floor(
                (
                    videoWidth -
                    cropWidth
                ) / 2
            )
        );


    const sy =
        Math.max(
            0,
            Math.floor(
                (
                    videoHeight -
                    cropHeight
                ) / 2
            )
        );


    sourceVideo.currentTime =
        trimStart;


    await new Promise(
        resolve => {

            const handler =
                () => {

                    sourceVideo.removeEventListener(
                        "seeked",
                        handler
                    );

                    resolve();

                };


            sourceVideo.addEventListener(
                "seeked",
                handler
            );

        }
    );


    recorder.start(
        250
    );


    const started =
        performance.now();


    function drawFrame(){

        if(
            recorder.state !==
            "recording"
        ){

            return;

        }


        ctx.drawImage(

            sourceVideo,

            sx,
            sy,
            cropWidth,
            cropHeight,

            0,
            0,
            outputWidth,
            outputHeight

        );


        const elapsed =
            (
                performance.now() -
                started
            ) / 1000;


        const current =
            trimStart +
            elapsed;


        if(
            current >=
            trimEnd
        ){

            recorder.stop();

            return;

        }


        requestAnimationFrame(
            drawFrame
        );

    }


    sourceVideo.currentTime =
        trimStart;


    await sourceVideo.play();


    drawFrame();


    await finished;


    sourceVideo.pause();


    stream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );


    exportedBlob =
        new Blob(
            chunks,
            {
                type:
                    mimeType
            }
        );


    exportProgress.innerText =
        "✓ Cropped Reel ready — " +
        (
            durationText()
        ) +
        " seconds";


    toast(
        "Real cropped Reel created ✓"
    );

}

/* =========================================================
   PUBLISH
========================================================= */

document.getElementById(
    "publishBtn"
).addEventListener(
    "click",
    async function(){

        if(!currentUser){

            window.location.href =
                "/login";

            return;

        }


        if(!exportedBlob){

            toast(
                "Please click Export Crop first."
            );

            return;

        }


        const caption =
            document.getElementById(
                "caption"
            )
            .value
            .trim();


        const hashtagText =
            document.getElementById(
                "hashtags"
            )
            .value
            .trim();


        const hashtags =
            hashtagText
                .split(/\s+/)
                .filter(Boolean)
                .map(
                    h =>
                        h.replace(
                            /^#/,
                            ""
                        )
                );


        const duration =
            trimEnd -
            trimStart;


        if(
            duration < 30 ||
            duration > 50
        ){

            toast(
                "Reel must be 30–50 seconds."
            );

            return;

        }


        const button =
            this;


        button.disabled =
            true;


        button.innerText =
            "Uploading...";


        try{

            const extension =
                exportedMime.includes(
                    "webm"
                )
                    ? "webm"
                    : "mp4";


            const path =
                currentUser.id +
                "/" +
                crypto.randomUUID() +
                "." +
                extension;


            /* ---------------------------------------------
               Upload processed/cropped video
            --------------------------------------------- */

            const {
                error:uploadError
            } =
            await supabaseClient
                .storage
                .from("reels")
                .upload(
                    path,
                    exportedBlob,
                    {
                        contentType:
                            exportedMime,
                        upsert:false
                    }
                );


            if(uploadError){

                throw uploadError;

            }


            const {
                data:urlData
            } =
            supabaseClient
                .storage
                .from("reels")
                .getPublicUrl(
                    path
                );


            const videoUrl =
                urlData.publicUrl;


            /* ---------------------------------------------
               Create database record
            --------------------------------------------- */

            const {
                data:reel,
                error
            } =
            await supabaseClient
                .from("reels")
                .insert({

                    user_id:
                        currentUser.id,

                    video_url:
                        videoUrl,

                    storage_path:
                        path,

                    caption:
                        caption ||
                        null,

                    hashtags:
                        hashtags,

                    duration_seconds:
                        Number(
                            duration.toFixed(2)
                        ),

                    crop_ratio:
                        cropRatio,

                    trim_start:
                        trimStart,

                    trim_end:
                        trimEnd,

                    status:
                        "active"

                })
                .select()
                .single();


            if(error){

                await supabaseClient
                    .storage
                    .from("reels")
                    .remove([
                        path
                    ]);

                throw error;

            }


            toast(
                "Reel published successfully! 🎬"
            );


            /* ---------------------------------------------
               Reset
            --------------------------------------------- */

            exportedBlob =
                null;

            videoFile.value =
                "";

            document.getElementById(
                "caption"
            ).value =
                "";

            document.getElementById(
                "hashtags"
            ).value =
                "";


            editor.style.display =
                "none";


            uploadPanel.style.display =
                "none";


            activateButton(
                "feedBtn"
            );


            await loadReels();

        }
        catch(error){

            console.error(
                "Publish Reel error:",
                error
            );


            toast(
                "Unable to publish Reel: " +
                error.message
            );

        }
        finally{

            button.disabled =
                false;

            button.innerText =
                "🚀 Publish Reel";

        }

    }
);


/* =========================================================
   NAVIGATION
========================================================= */

function activateButton(
    id
){

    document
        .querySelectorAll(
            ".top-btn"
        )
        .forEach(
            btn =>
                btn.classList.remove(
                    "active"
                )
        );


    document.getElementById(
        id
    )
    .classList.add(
        "active"
    );

}

/* =========================================================
   DASHBOARD DATA
========================================================= */

async function loadDashboard(){

    const {
        data:reels
    } =
    await supabaseClient
        .from("reels")
        .select(`
            id,
            caption,
            views_count,
            likes_count,
            comments_count,
            shares_count,
            whatsapp_clicks_count,
            created_at
        `)
        .eq(
            "user_id",
            currentUser.id
        );


    const rows =
        reels || [];


    let views = 0;
    let likes = 0;
    let comments = 0;
    let shares = 0;


    rows.forEach(
        reel => {

            views +=
                Number(
                    reel.views_count || 0
                );

            likes +=
                Number(
                    reel.likes_count || 0
                );

            comments +=
                Number(
                    reel.comments_count || 0
                );

            shares +=
                Number(
                    reel.shares_count || 0
                );

        }
    );


    document.getElementById(
        "dashViews"
    ).innerText =
        formatCount(views);


    document.getElementById(
        "dashLikes"
    ).innerText =
        formatCount(likes);


    document.getElementById(
        "dashComments"
    ).innerText =
        formatCount(comments);


    document.getElementById(
        "dashShares"
    ).innerText =
        formatCount(shares);


    /* -----------------------------------------------------
       Daily stats
    ----------------------------------------------------- */

    const {
        data:daily
    } =
    await supabaseClient
        .from("reel_daily_stats")
        .select(`
            stat_date,
            views_count,
            likes_count,
            comments_count,
            shares_count
        `)
        .eq(
            "user_id",
            currentUser.id
        )
        .gte(
            "stat_date",
            new Date(
                Date.now() -
                6 *
                86400000
            )
            .toISOString()
            .slice(0,10)
        )
        .order(
            "stat_date",
            {
                ascending:false
            }
        );


    const dailyContainer =
        document.getElementById(
            "dailyStats"
        );


    dailyContainer.innerHTML =
        "";


    if(!daily?.length){

        dailyContainer.innerHTML = `

            <div class="dashboard-reel">

                No daily statistics yet.

                <br>

                Statistics will appear as
                your Reels receive activity.

            </div>

        `;

    }
    else{

        daily.forEach(
            row => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "dashboard-reel";


                div.innerHTML = `

                    <div class="dashboard-reel-title">

                        ${escapeHtml(
                            row.stat_date
                        )}

                    </div>

                    <div class="dashboard-reel-stats">

                        👁 ${formatCount(
                            row.views_count
                        )}

                        &nbsp;&nbsp;

                        ❤️ ${formatCount(
                            row.likes_count
                        )}

                        &nbsp;&nbsp;

                        💬 ${formatCount(
                            row.comments_count
                        )}

                        &nbsp;&nbsp;

                        ↗ ${formatCount(
                            row.shares_count
                        )}

                    </div>

                `;


                dailyContainer.appendChild(
                    div
                );

            }
        );

    }


    /* -----------------------------------------------------
       Reel performance
    ----------------------------------------------------- */

    const dashboardReels =
        document.getElementById(
            "dashboardReels"
        );


    dashboardReels.innerHTML =
        "";


    rows
        .sort(
            (
                a,
                b
            ) =>
                Number(
                    b.views_count
                ) -
                Number(
                    a.views_count
                )
        )
        .forEach(
            reel => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "dashboard-reel";


                div.innerHTML = `

                    <div class="dashboard-reel-title">

                        ${
                            escapeHtml(
                                reel.caption ||
                                "Untitled Reel"
                            )
                        }

                    </div>


                    <div class="dashboard-reel-stats">

                        👁 ${formatCount(
                            reel.views_count
                        )}

                        &nbsp;

                        ❤️ ${formatCount(
                            reel.likes_count
                        )}

                        &nbsp;

                        💬 ${formatCount(
                            reel.comments_count
                        )}

                        &nbsp;

                        ↗ ${formatCount(
                            reel.shares_count
                        )}

                        &nbsp;

                        🟢 ${formatCount(
                            reel.whatsapp_clicks_count
                        )}

                    </div>

                `;


                dashboardReels.appendChild(
                    div
                );

            }
        );

}
