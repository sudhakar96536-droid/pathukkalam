<!DOCTYPE html>
<html lang="en">

<head>

<style>

*{

body{

button{

.top-actions{

.top-btn{

.editor-buttons{

.dashboard{

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://jxpvkamxtedgzztozonl.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_DCI0qvAlYNWi8DZkZF2g_frSEW_OX";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   GLOBALS
========================================================= */

let currentUser = null;

let currentProfile = null;

let allReels = [];

let selectedFile = null;

let sourceUrl = null;

let cropRatio = "original";

let trimStart = 0;

let trimEnd = 0;

let exportedBlob = null;

let exportedMime = "video/webm";


/* =========================================================
   ELEMENTS
========================================================= */

const feed =
    document.getElementById("feed");

const uploadPanel =
    document.getElementById("uploadPanel");

const dashboard =
    document.getElementById("dashboard");

const editor =
    document.getElementById("editor");

const sourceVideo =
    document.getElementById("sourceVideo");

const cropOverlay =
    document.getElementById("cropOverlay");

const videoFile =
    document.getElementById("videoFile");

const startRange =
    document.getElementById("startRange");

const endRange =
    document.getElementById("endRange");

const trimLabel =
    document.getElementById("trimLabel");

const processing =
    document.getElementById("processing");

const publishBtn =
    document.getElementById("publishBtn");


/* =========================================================
   TOAST
========================================================= */

function toast(message){

    const el =
        document.getElementById("toast");

    el.innerText =
        message;

    el.classList.add("show");

    setTimeout(
        () => {

            el.classList.remove(
                "show"
            );

        },
        3000
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


/* =========================================================
   FORMAT COUNT
========================================================= */

function formatCount(number){

    number =
        Number(number || 0);


    if(number >= 1000000){

        return (
            (number / 1000000)
                .toFixed(1)
                .replace(".0","") +
            "M"
        );

    }


    if(number >= 1000){

        return (
            (number / 1000)
                .toFixed(1)
                .replace(".0","") +
            "K"
        );

    }


    return String(number);

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

    if(!value)
        return "";


    const date =
        new Date(value);


    return date.toLocaleDateString(
        undefined,
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   CURRENT USER
========================================================= */

async function loadCurrentUser(){

    /*
       IMPORTANT:

       getUser() reads the already existing
       Supabase authentication session.

       We do NOT ask the user to login again
       if the session is already available.
    */

    let {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    /*
       Sometimes the auth state can still be
       restoring when the page opens.

       Give Supabase a moment before deciding
       that the user is logged out.
    */

    if(
        error ||
        !data ||
        !data.user
    ){

        const {
            data:sessionData
        } =
        await supabaseClient
            .auth
            .getSession();


        if(
            sessionData?.session?.user
        ){

            data = {
                user:
                    sessionData
                        .session
                        .user
            };

        }

    }


    if(
        !data ||
        !data.user
    ){

        window.location.href =
            "/login";

        return false;

    }


    currentUser =
        data.user;


    const {
        data:profile,
        error:profileError
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            name,
            profile_url
        `)
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if(profileError){

        console.warn(
            "Profile loading error:",
            profileError
        );

    }


    currentProfile =
        profile || null;


    return true;

}


/* =========================================================
   LOAD REELS
========================================================= */

async function loadReels(){

    feed.innerHTML = `

        <div class="loading">

            <i class="fas fa-spinner fa-spin"></i>

            <div>
                Loading Reels...
            </div>

        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("reels")
        .select(`
            id,
            user_id,
            video_url,
            caption,
            hashtags,
            duration_seconds,
            crop_ratio,
            views_count,
            likes_count,
            comments_count,
            shares_count,
            whatsapp_clicks_count,
            created_at
        `)
        .eq(
            "status",
            "active"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Load reels error:",
            error
        );


        feed.innerHTML = `

            <div class="empty">

                Unable to load Reels.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    allReels =
        data || [];


    await attachProfiles();

}


/* =========================================================
   ATTACH PROFILES
========================================================= */

async function attachProfiles(){

    const ids =
        [
            ...new Set(
                allReels
                    .map(
                        reel =>
                            reel.user_id
                    )
            )
        ];


    if(!ids.length){

        renderFeed();

        return;

    }


    const {
        data:profiles,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            name,
            profile_url
        `)
        .in(
            "id",
            ids
        );


    if(error){

        console.warn(
            "Profile list error:",
            error
        );

    }


    const map =
        new Map();


    (profiles || [])
        .forEach(
            profile => {

                map.set(
                    profile.id,
                    profile
                );

            }
        );


    allReels =
        allReels.map(
            reel => ({

                ...reel,

                profile:
                    map.get(
                        reel.user_id
                    ) || null

            })
        );


    renderFeed();

}


/* =========================================================
   RENDER FEED
========================================================= */

function renderFeed(){

    feed.innerHTML = "";


    if(!allReels.length){

        feed.innerHTML = `

            <div class="empty">

                🎬

                <br><br>

                No Reels yet.

                <br><br>

                Be the first to upload!

            </div>

        `;

        return;

    }


    allReels.forEach(
        reel => {

            feed.appendChild(
                createReelCard(
                    reel
                )
            );

        }
    );

}


/* =========================================================
   CREATE REEL CARD
========================================================= */

function createReelCard(reel){

    const card =
        document.createElement("div");

    card.className =
        "reel-card";


    const profile =
        reel.profile;


    const avatar =
        profile?.profile_url ||
        "https://i.pravatar.cc/100";


    const name =
        profile?.name ||
        profile?.username ||
        "Pathukkalam User";


    const username =
        profile?.username ||
        "user";


    const hashtags =
        Array.isArray(
            reel.hashtags
        )
            ? reel.hashtags
                .map(
                    h =>
                        h.startsWith("#")
                            ? h
                            : "#" + h
                )
                .join(" ")
            : "";


    card.innerHTML = `

        <video
            class="reel-video"
            src="${escapeHtml(
                reel.video_url
            )}"
            playsinline
            controls
            preload="metadata">
        </video>


        <div class="reel-info">


            <!-- POSTER -->

            <div class="poster-row">

                <img
                    class="poster-avatar"
                    src="${escapeHtml(
                        avatar
                    )}"
                    onerror="
                        this.src='https://i.pravatar.cc/100'
                    ">

/* =========================================================

========================================================= */

async function toggleLike(
    reel,
    button
){

    const {
        data:existing,
        error:findError
    } =
    await supabaseClient
        .from("reel_likes")
        .select("id")
        .eq(
            "reel_id",
            reel.id
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .maybeSingle();


    if(findError){

        toast(
            "Unable to check Like."
        );

        console.error(
            findError
        );

        return;

    }


    if(existing){

        const {
            error
        } =
        await supabaseClient
            .from("reel_likes")
            .delete()
            .eq(
                "id",
                existing.id
            );


        if(error){

            toast(
                "Unable to unlike Reel."
            );

            return;

        }


        await decrementReelCounter(
            reel.id,
            "likes_count"
        );


        button.classList.remove(
            "liked"
        );

    }
    else{

        const {
            error
        } =
        await supabaseClient
            .from("reel_likes")
            .insert({

                reel_id:
                    reel.id,

                user_id:
                    currentUser.id

            });


        if(error){

            toast(
                "Unable to like Reel."
            );

            console.error(
                error
            );

            return;

        }


        await incrementReelCounter(
            reel.id,
            "likes_count"
        );


        button.classList.add(
            "liked"
        );


        if(
            reel.user_id !==
            currentUser.id
        ){

            await createNotification({

                user_id:
                    reel.user_id,

                sender_id:
                    currentUser.id,

                reel_id:
                    reel.id,

                notification_type:
                    "reel_like",

                message:
                    (
                        currentProfile?.name ||
                        "Someone"
                    ) +
                    " liked your Reel."

            });

        }

    }


    await loadReels();

}

   COMMENTS
========================================================= */

async function loadComments(
    reel,
    commentsBox
){

    const list =
        commentsBox.querySelector(
            ".comment-list"
        );


    list.innerHTML = `

        <div
            style="
                color:#777;
                font-size:12px;
                padding:10px;
            ">

            Loading comments...

        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("reel_comments")
        .select(`
            id,
            user_id,
            comment,
            created_at
        `)
        .eq(
            "reel_id",
            reel.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        list.innerHTML =
            "Unable to load comments.";

        console.error(
            error
        );

        return;

    }


    if(!data?.length){

        list.innerHTML = `

            <div
                style="
                    color:#777;
                    font-size:12px;
                    padding:8px;
                ">

                No comments yet.

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    const ids =
        [
            ...new Set(
                data.map(
                    c =>
                        c.user_id
                )
            )
        ];


    let profiles = [];


    if(ids.length){

        const result =
            await supabaseClient
                .from("profiles")
                .select(`
                    id,
                    username,
                    name
                `)
                .in(
                    "id",
                    ids
                );


        profiles =
            result.data || [];

    }


    const map =
        new Map();


    profiles.forEach(
        profile => {

            map.set(
                profile.id,
                profile
            );

        }
    );


    data.forEach(
        comment => {

            const p =
                map.get(
                    comment.user_id
                );


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "comment-item";


            item.innerHTML = `

                <b>

                    ${escapeHtml(
                        p?.name ||
                        p?.username ||
                        "User"
                    )}

                </b>

                <br>

                ${escapeHtml(
                    comment.comment
                )}

            `;


            list.appendChild(
                item
            );

        }
    );

}

/* =========================================================
   COUNTERS
========================================================= */

async function incrementReelCounter(
    reelId,
    column
){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("reels")
        .select(
            column
        )
        .eq(
            "id",
            reelId
        )
        .single();


    if(error || !data){

        console.warn(
            "Counter read error:",
            error
        );

        return;

    }


    const value =
        Number(
            data[column] || 0
        );


    const {
        error:updateError
    } =
    await supabaseClient
        .from("reels")
        .update({

            [column]:
                value + 1

        })
        .eq(
            "id",
            reelId
        );


    if(updateError){

        console.warn(
            "Counter update error:",
            updateError
        );

    }

}


async function decrementReelCounter(
    reelId,
    column
){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("reels")
        .select(
            column
        )
        .eq(
            "id",
            reelId
        )
        .single();


    if(error || !data)
        return;


    const value =
        Math.max(
            0,
            Number(
                data[column] || 0
            ) - 1
        );


    await supabaseClient
        .from("reels")
        .update({

            [column]:
                value

        })
        .eq(
            "id",
            reelId
        );

}

videoFile.addEventListener(
    "change",
    async function(){

        const file =
            this.files?.[0];


        if(!file)
            return;


        if(
            !file.type.startsWith(
                "video/"
            )
        ){

            toast(
                "Please select a video."
            );

            this.value =
                "";

            return;

        }


        selectedFile =
            file;


        if(sourceUrl){

            URL.revokeObjectURL(
                sourceUrl
            );

        }


        sourceUrl =
            URL.createObjectURL(
                file
            );


        sourceVideo.src =
            sourceUrl;


        try{

            await new Promise(
                (resolve,reject) => {

                    sourceVideo.onloadedmetadata =
                        resolve;

                    sourceVideo.onerror =
                        reject;

                }
            );

        }
        catch(error){

            toast(
                "Unable to read this video."
            );

            this.value =
                "";

            return;

        }


        const duration =
            Number(
                sourceVideo.duration
            );


        if(
            !Number.isFinite(
                duration
            ) ||
            duration <= 0
        ){

            toast(
                "Unable to determine video duration."
            );

            this.value =
                "";

            return;

        }


        /*
           MAXIMUM 50 SECONDS.

           NO MINIMUM.

           If original video is longer than
           50 seconds, End is limited to 50.
        */

        startRange.max =
            Math.max(
                0,
                Math.min(
                    duration,
                    50
                )
            );


        endRange.max =
            Math.min(
                50,
                duration
            );


        startRange.min =
            0;


        endRange.min =
            0;


        trimStart =
            0;


        trimEnd =
            Math.min(
                50,
                duration
            );


        startRange.value =
            trimStart;


        endRange.value =
            trimEnd;


        editor.style.display =
            "block";


        updateTrimLabel();

        updateCropOverlay();

    }
);

/* =========================================================
   GET RATIO
========================================================= */

function getRatio(){

    if(
        cropRatio ===
        "9:16"
    ){

        return 9 / 16;

    }


    if(
        cropRatio ===
        "1:1"
    ){

        return 1;

    }


    if(
        cropRatio ===
        "4:5"
    ){

        return 4 / 5;

    }


    if(
        cropRatio ===
        "16:9"
    ){

        return 16 / 9;

    }


    return null;

}


/* =========================================================
   UPDATE CROP OVERLAY
========================================================= */

function updateCropOverlay(){

    const wrap =
        document.querySelector(
            ".editor-video-wrap"
        );


    if(
        !sourceVideo.videoWidth ||
        !sourceVideo.videoHeight
    ){

        return;

    }


    const videoRatio =
        sourceVideo.videoWidth /
        sourceVideo.videoHeight;


    const ratio =
        getRatio();


    let width =
        wrap.clientWidth;


    let height =
        width /
        videoRatio;


    if(
        ratio &&
        ratio < videoRatio
    ){

        width =
            height *
            ratio;

    }
    else if(ratio){

        height =
            width /
            ratio;

    }


    const maxWidth =
        wrap.clientWidth;


    const maxHeight =
        sourceVideo.clientHeight;


    width =
        Math.min(
            width,
            maxWidth
        );


    height =
        Math.min(
            height,
            maxHeight
        );


    cropOverlay.style.width =
        width + "px";


    cropOverlay.style.height =
        height + "px";


    cropOverlay.style.left =
        (
            (maxWidth - width) /
            2
        ) + "px";


    cropOverlay.style.top =
        (
            (maxHeight - height) /
            2
        ) + "px";

}

/* =========================================================
   PREVIEW CROP
========================================================= */

document.getElementById(
    "previewCropBtn"
).addEventListener(
    "click",
    async function(){

        if(
            !sourceVideo.src
        ){

            toast(
                "Please select a video first."
            );

            return;

        }


        const duration =
            trimEnd -
            trimStart;


        if(duration < 0){

            toast(
                "Invalid crop selection."
            );

            return;

        }


        sourceVideo.currentTime =
            trimStart;


        try{

            await sourceVideo.play();

        }
        catch(error){

            console.warn(
                error
            );

        }


        /*
           Stop preview at selected End time.
        */

        const stopPreview =
            function(){

                if(
                    sourceVideo.currentTime >=
                    trimEnd
                ){

                    sourceVideo.pause();

                    sourceVideo.removeEventListener(
                        "timeupdate",
                        stopPreview
                    );

                }

            };


        sourceVideo.addEventListener(
            "timeupdate",
            stopPreview
        );

    }
);


/* =========================================================
   REAL CROP PROCESSOR
   Runs AUTOMATICALLY when Post Reel is clicked.
========================================================= */

async function exportProcessedVideo(){

    processing.style.display =
        "block";


    processing.innerText =
        "⏳ Preparing Reel...";


    const duration =
        trimEnd -
        trimStart;


    /*
       Maximum 50 seconds.
       No minimum.
    */

    if(
        duration < 0 ||
        duration > 50
    ){

        throw new Error(
            "Reel duration cannot exceed 50 seconds."
        );

    }


    const videoWidth =
        sourceVideo.videoWidth;


    const videoHeight =
        sourceVideo.videoHeight;


    if(
        !videoWidth ||
        !videoHeight
    ){

        throw new Error(
            "Video dimensions unavailable."
        );

    }


    const ratio =
        getRatio();


    let cropWidth =
        videoWidth;


    let cropHeight =
        videoHeight;


    /*
       Calculate center crop.
    */

    if(ratio){

        if(
            videoWidth /
            videoHeight >
            ratio
        ){

            cropHeight =
                videoHeight;


            cropWidth =
                cropHeight *
                ratio;

        }
        else{

            cropWidth =
                videoWidth;


            cropHeight =
                cropWidth /
                ratio;

        }

    }


    cropWidth =
        Math.floor(
            cropWidth
        );


    cropHeight =
        Math.floor(
            cropHeight
        );


    /*
       Keep output manageable.
    */

    const maxOutput =
        720;


    let outputWidth =
        cropWidth;


    let outputHeight =
        cropHeight;


    /*
       For vertical video, constrain height too.
    */

    const maxOutputHeight =
        1280;


    let scale =
        1;


    if(
        outputWidth >
        maxOutput
    ){

        scale =
            Math.min(
                scale,
                maxOutput /
                outputWidth
            );

    }


    if(
        outputHeight >
        maxOutputHeight
    ){

        scale =
            Math.min(
                scale,
                maxOutputHeight /
                outputHeight
            );

    }


    outputWidth =
        Math.max(
            2,
            Math.floor(
                outputWidth *
                scale
            )
        );


    outputHeight =
        Math.max(
            2,
            Math.floor(
                outputHeight *
                scale
            )
        );


    /*
       Some encoders prefer even dimensions.
    */

    outputWidth -=
        outputWidth % 2;


    outputHeight -=
        outputHeight % 2;


    outputWidth =
        Math.max(
            2,
            outputWidth
        );


    outputHeight =
        Math.max(
            2,
            outputHeight
        );


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        outputWidth;


    canvas.height =
        outputHeight;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
       Center crop position.
    */

    const sx =
        Math.max(
            0,
            Math.floor(
                (
                    videoWidth -
                    cropWidth
                ) /
                2
            )
        );


    const sy =
        Math.max(
            0,
            Math.floor(
                (
                    videoHeight -
                    cropHeight
                ) /
                2
            )
        );


    /*
       Seek to selected beginning.
    */

    sourceVideo.pause();


    sourceVideo.currentTime =
        trimStart;


    await new Promise(
        (resolve,reject) => {

            let finished =
                false;


            const done =
                () => {

                    if(finished)
                        return;


                    finished =
                        true;


                    sourceVideo.removeEventListener(
                        "seeked",
                        done
                    );


                    resolve();

                };


            const failed =
                () => {

                    if(finished)
                        return;


                    finished =
                        true;


                    sourceVideo.removeEventListener(
                        "error",
                        failed
                    );


                    reject(
                        new Error(
                            "Unable to seek video."
                        )
                    );

                };


            sourceVideo.addEventListener(
                "seeked",
                done,
                {
                    once:true
                }
            );


            sourceVideo.addEventListener(
                "error",
                failed,
                {
                    once:true
                );

        }
    );


    /*
       Capture canvas video.
    */

    const stream =
        canvas.captureStream(
            30
        );


    /*
       Capture audio from original video
       when browser supports it.
    */

    let sourceCapture =
        null;


    try{

        if(
            typeof sourceVideo.captureStream ===
            "function"
        ){

            sourceCapture =
                sourceVideo.captureStream();


            sourceCapture
                .getAudioTracks()
                .forEach(
                    track => {

                        stream.addTrack(
                            track
                        );

                    }
                );

        }

    }
    catch(error){

        console.warn(
            "Audio capture unavailable:",
            error
        );

    }


    /*
       Supported browser MIME types.
    */

    const mimeTypes = [

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm"

    ];


    let mimeType =
        "";


    for(
        const type
        of mimeTypes
    ){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            mimeType =
                type;

            break;

        }

    }


    if(!mimeType){

        throw new Error(
            "This browser does not support video processing."
        );

    }


    exportedMime =
        mimeType;


    const recorder =
        new MediaRecorder(
            stream,
            {
                mimeType:mimeType
            }
        );


    const chunks =
        [];


    recorder.ondataavailable =
        event => {

            if(
                event.data &&
                event.data.size
            ){

                chunks.push(
                    event.data
                );

            }

        };


    const finished =
        new Promise(
            (resolve,reject) => {

                recorder.onerror =
                    reject;


                recorder.onstop =
                    resolve;

            }
        );


    recorder.start(
        250
    );


    /*
       Playback for the processor.
    */

    sourceVideo.currentTime =
        trimStart;


    await sourceVideo.play();


    const started =
        performance.now();


    processing.innerText =
        "⏳ Processing crop... 0%";


    function drawFrame(){

        if(
            recorder.state !==
            "recording"
        ){

            return;

        }


        ctx.drawImage(

            sourceVideo,

            sx,
            sy,
            cropWidth,
            cropHeight,

            0,
            0,
            outputWidth,
            outputHeight

        );


        const elapsed =
            (
                performance.now() -
                started
            ) / 1000;


        const percentage =
            duration > 0
                ? Math.min(
                    100,
                    (
                        elapsed /
                        duration
                    ) *
                    100
                )
                : 100;


        processing.innerText =
            "⏳ Processing crop... " +
            Math.floor(
                percentage
            ) +
            "%";


        if(
            elapsed >=
            duration
        ){

            recorder.stop();

            return;

        }


        /*
           Extra safety:
           stop if video reaches selected End.
        */

        if(
            sourceVideo.currentTime >=
            trimEnd
        ){

            recorder.stop();

            return;

        }


        requestAnimationFrame(
            drawFrame
        );

    }


    /*
       Zero-duration selection:
       capture one frame.
    */

    if(
        duration === 0
    ){

        ctx.drawImage(

            sourceVideo,

            sx,
            sy,
            cropWidth,
            cropHeight,

            0,
            0,
            outputWidth,
            outputHeight

        );


        setTimeout(
            () => {

                if(
                    recorder.state ===
                    "recording"
                ){

                    recorder.stop();

                }

            },
            500
        );

    }
    else{

        drawFrame();

    }


    await finished;


    sourceVideo.pause();


    if(sourceCapture){

        sourceCapture
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    stream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );


    exportedBlob =
        new Blob(
            chunks,
            {
                type:mimeType
            }
        );


    if(
        !exportedBlob ||
        exportedBlob.size === 0
    ){

        throw new Error(
            "Processed video is empty."
        );

    }


    processing.innerText =
        "✓ Reel processed successfully.";

}


/* =========================================================
   PUBLISH REEL
========================================================= */

publishBtn.addEventListener(
    "click",
    async function(){

        /*
           Never ask login again when the current
           Supabase session is already available.
        */

        if(!currentUser){

            const loggedIn =
                await loadCurrentUser();


            if(!loggedIn)
                return;

        }


        if(!selectedFile){

            toast(
                "Please select a video first."
            );

            return;

        }


        const duration =
            trimEnd -
            trimStart;


        /*
           Maximum 50 seconds.
           NO minimum.
        */

        if(
            duration < 0 ||
            duration > 50
        ){

            toast(
                "Reel duration must not exceed 50 seconds."
            );

            return;

        }


        const caption =
            document.getElementById(
                "caption"
            )
            .value
            .trim();


        const hashtagText =
            document.getElementById(
                "hashtags"
            )
            .value
            .trim();


        const hashtags =
            hashtagText
                .split(/\s+/)
                .filter(Boolean)
                .map(
                    h =>
                        h.replace(
                            /^#/,
                            ""
                        )
                );


        publishBtn.disabled =
            true;


        publishBtn.innerText =
            "⏳ Processing & Posting...";


        try{

            /*
               =================================================
               STEP 1
               Automatically process crop + trim.

               User does NOT see an Export button.
               =================================================
            */

            await exportProcessedVideo();


            if(!exportedBlob){

                throw new Error(
                    "Unable to process Reel."
                );

            }


            /*
               =================================================
               STEP 2
               Upload processed video
               =================================================
            */

            processing.innerText =
                "☁️ Uploading Reel...";


            const extension =
                exportedMime.includes(
                    "webm"
                )
                    ? "webm"
                    : "mp4";


            const path =
                currentUser.id +
                "/" +
                crypto.randomUUID() +
                "." +
                extension;


            const {
                error:uploadError
            } =
            await supabaseClient
                .storage
                .from("reels")
                .upload(
                    path,
                    exportedBlob,
                    {
                        contentType:
                            exportedMime,

                        upsert:
                            false
                    }
                );


            if(uploadError){

                throw uploadError;

            }


            /*
               =================================================
               STEP 3
               Public URL
               =================================================
            */

            const {
                data:urlData
            } =
            supabaseClient
                .storage
                .from("reels")
                .getPublicUrl(
                    path
                );


            const videoUrl =
                urlData.publicUrl;


            /*
               =================================================
               STEP 4
               Database record
               =================================================
            */

            processing.innerText =
                "💾 Publishing Reel...";


            const {
                data:reel,
                error
            } =
            await supabaseClient
                .from("reels")
                .insert({

                    user_id:
                        currentUser.id,

                    video_url:
                        videoUrl,

                    storage_path:
                        path,

                    caption:
                        caption ||
                        null,

                    hashtags:
                        hashtags,

                    duration_seconds:
                        Number(
                            duration.toFixed(
                                2
                            )
                        ),

                    crop_ratio:
                        cropRatio,

                    trim_start:
                        Number(
                            trimStart.toFixed(
                                2
                            )
                        ),

                    trim_end:
                        Number(
                            trimEnd.toFixed(
                                2
                            )
                        ),

                    status:
                        "active"

                })
                .select()
                .single();


            if(error){

                /*
                   Database failed.

                   Remove uploaded file so we don't
                   leave an orphan in Storage.
                */

                await supabaseClient
                    .storage
                    .from("reels")
                    .remove([
                        path
                    ]);


                throw error;

            }


            console.log(
                "Published Reel:",
                reel
            );


            toast(
                "Reel posted successfully! 🎬"
            );


            /*
               =================================================
               RESET FORM
               =================================================
            */

            exportedBlob =
                null;


            selectedFile =
                null;


            if(sourceUrl){

                URL.revokeObjectURL(
                    sourceUrl
                );

                sourceUrl =
                    null;

            }


            videoFile.value =
                "";


            document.getElementById(
                "caption"
            ).value =
                "";


            document.getElementById(
                "hashtags"
            ).value =
                "";


            sourceVideo.pause();


            sourceVideo.removeAttribute(
                "src"
            );


            sourceVideo.load();


            editor.style.display =
                "none";


            processing.style.display =
                "none";


            uploadPanel.style.display =
                "none";


            activateButton(
                "feedBtn"
            );


            feed.style.display =
                "block";


            dashboard.style.display =
                "none";


            await loadReels();

        }
        catch(error){

            console.error(
                "Publish Reel error:",
                error
            );


            processing.innerText =
                "❌ " +
                error.message;


            toast(
                "Unable to post Reel: " +
                error.message
            );

        }
        finally{

            publishBtn.disabled =
                false;


            publishBtn.innerText =
                "🚀 Post Reel";

        }

    }
);


/* =========================================================
   NAVIGATION
========================================================= */

function activateButton(id){

    document
        .querySelectorAll(
            ".top-btn"
        )
        .forEach(
            btn => {

                btn.classList.remove(
                    "active"
                );

            }
        );


    document.getElementById(
        id
    )
    .classList.add(
        "active"
    );

}

/* =========================================================
   DASHBOARD
========================================================= */

async function loadDashboard(){

    const {
        data:reels,
        error
    } =
    await supabaseClient
        .from("reels")
        .select(`
            id,
            caption,
            views_count,
            likes_count,
            comments_count,
            shares_count,
            whatsapp_clicks_count,
            created_at
        `)
        .eq(
            "user_id",
            currentUser.id
        );


    if(error){

        toast(
            error.message
        );

        return;

    }


    const rows =
        reels || [];


    let views =
        0;


    let likes =
        0;


    let comments =
        0;


    let shares =
        0;


    rows.forEach(
        reel => {

            views +=
                Number(
                    reel.views_count ||
                    0
                );


            likes +=
                Number(
                    reel.likes_count ||
                    0
                );


            comments +=
                Number(
                    reel.comments_count ||
                    0
                );


            shares +=
                Number(
                    reel.shares_count ||
                    0
                );

        }
    );


    document.getElementById(
        "dashViews"
    ).innerText =
        formatCount(
            views
        );


    document.getElementById(
        "dashLikes"
    ).innerText =
        formatCount(
            likes
        );


    document.getElementById(
        "dashComments"
    ).innerText =
        formatCount(
            comments
        );


    document.getElementById(
        "dashShares"
    ).innerText =
        formatCount(
            shares
        );


    /* =====================================================
       LAST 7 DAYS
    ===================================================== */

    const sevenDaysAgo =
        new Date(
            Date.now() -
            6 *
            86400000
        )
        .toISOString()
        .slice(
            0,
            10
        );


    const {
        data:daily,
        error:dailyError
    } =
    await supabaseClient
        .from("reel_daily_stats")
        .select(`
            stat_date,
            views_count,
            likes_count,
            comments_count,
            shares_count
        `)
        .eq(
            "user_id",
            currentUser.id
        )
        .gte(
            "stat_date",
            sevenDaysAgo
        )
        .order(
            "stat_date",
            {
                ascending:false
            }
        );


    const dailyContainer =
        document.getElementById(
            "dailyStats"
        );


    dailyContainer.innerHTML =
        "";


    if(
        dailyError ||
        !daily?.length
    ){

        dailyContainer.innerHTML = `

            <div class="dashboard-reel">

                No daily statistics yet.

                <br>

                Statistics will appear as
                your Reels receive activity.

            </div>

        `;

    }
    else{

        daily.forEach(
            row => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "dashboard-reel";


                div.innerHTML = `

                    <div class="dashboard-reel-title">

                        ${escapeHtml(
                            row.stat_date
                        )}

                    </div>


                    <div class="dashboard-reel-stats">

                        👁
                        ${formatCount(
                            row.views_count
                        )}

                        &nbsp;&nbsp;

                        ❤️
                        ${formatCount(
                            row.likes_count
                        )}

                        &nbsp;&nbsp;

                        💬
                        ${formatCount(
                            row.comments_count
                        )}

                        &nbsp;&nbsp;

                        ↗
                        ${formatCount(
                            row.shares_count
                        )}

                    </div>

                `;


                dailyContainer.appendChild(
                    div
                );

            }
        );

    }


    /* =====================================================
       REEL PERFORMANCE
    ===================================================== */

    const dashboardReels =
        document.getElementById(
            "dashboardReels"
        );


    dashboardReels.innerHTML =
        "";


    rows
        .sort(
            (
                a,
                b
            ) =>

                Number(
                    b.views_count ||
                    0
                ) -

                Number(
                    a.views_count ||
                    0
                )

        )
        .forEach(
            reel => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "dashboard-reel";


                div.innerHTML = `

                    <div class="dashboard-reel-title">

                        ${escapeHtml(
                            reel.caption ||
                            "Untitled Reel"
                        )}

                    </div>


                    <div
                        class="dashboard-reel-stats">

                        👁
                        ${formatCount(
                            reel.views_count
                        )}

                        &nbsp;

                        ❤️
                        ${formatCount(
                            reel.likes_count
                        )}

                        &nbsp;

                        💬
                        ${formatCount(
                            reel.comments_count
                        )}

                        &nbsp;

                        ↗
                        ${formatCount(
                            reel.shares_count
                        )}

                        &nbsp;

                        🟢
                        ${formatCount(
                            reel.whatsapp_clicks_count
                        )}

                    </div>

                `;


                dashboardReels.appendChild(
                    div
                );

            }
        );

}


/* =========================================================
   AUTH STATE

   IMPORTANT:
   We listen for Supabase session changes but
   DO NOT redirect to login just because an
   INITIAL auth event is still being restored.
========================================================= */

supabaseClient
    .auth
    .onAuthStateChange(
        async (
            event,
            session
        ) => {

            console.log(
                "Supabase auth event:",
                event
            );


            if(
                session?.user
            ){

                currentUser =
                    session.user;

            }

        }
    );


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

    /*
       Supabase restores the existing browser
       session automatically.

       We wait for that session before deciding
       whether the user needs login.
    */

    const loggedIn =
        await loadCurrentUser();


    if(!loggedIn)
        return;


    await loadReels();

}


/* =========================================================
   START
========================================================= */

initialize();
