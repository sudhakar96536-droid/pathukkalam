{% extends "base.html" %}

{% block title %}Reset Password - Pathukkalam{% endblock %}

{% block head %}
<style>
*{box-sizing:border-box;}
body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.box{width:100%;max-width:400px;background:white;padding:30px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,.08);}
.logo{text-align:center;margin-bottom:25px;} .logo img{width:75px;height:75px;border-radius:18px;} .logo h1{color:#1877f2;margin:10px 0 5px;} .logo p{color:gray;}
.input-box{margin-top:18px;} label{display:block;margin-bottom:8px;font-size:14px;font-weight:bold;color:#444;}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;outline:none;font-size:15px;} input:focus{border-color:#1877f2;}
button{width:100%;padding:15px;margin-top:22px;border:0;border-radius:14px;background:#1877f2;color:white;font-size:16px;font-weight:bold;cursor:pointer;} button:disabled{opacity:.6;cursor:not-allowed;}
.message{text-align:center;margin-top:15px;font-size:14px;line-height:1.5;min-height:20px;}
</style>
{% endblock %}

{% block content %}
<div class="box">
<div class="logo"><img src="{{ url_for('static', filename='icon-192.png') }}"><h1>Pathukkalam</h1><p>Create a new password 🔐</p></div>
<form id="resetForm">
<div class="input-box"><label for="password">New Password</label><input type="password" id="password" placeholder="Enter new password" minlength="6" autocomplete="new-password" required></div>
<div class="input-box"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="6" autocomplete="new-password" required></div>
<button type="submit" id="resetBtn">Update Password</button>
<div id="message" class="message"></div>
</form></div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=supabase.createClient("https://jxpvkamxtedgzztozonl.supabase.co","sb_publishable_DCI0qvAlYNBpWi8DZkZF2g_frSEW_OX",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
document.getElementById("resetForm").addEventListener("submit",async function(e){
 e.preventDefault(); const p=document.getElementById("password").value; const cp=document.getElementById("confirmPassword").value; const btn=document.getElementById("resetBtn"); const msg=document.getElementById("message"); msg.innerText="";
 if(p.length<6){msg.style.color="red";msg.innerText="Password must be at least 6 characters.";return;}
 if(p!==cp){msg.style.color="red";msg.innerText="Passwords do not match.";return;}
 btn.disabled=true;btn.innerText="Updating...";
 try{
  const {data:{session},error:se}=await supabaseClient.auth.getSession(); if(se) throw se;
  if(!session) throw new Error("This reset link is invalid or has expired. Please request a new reset link.");
  const {error}=await supabaseClient.auth.updateUser({password:p}); if(error) throw error;
  msg.style.color="green";msg.innerText="Password updated successfully. Redirecting to login...";
  await supabaseClient.auth.signOut(); setTimeout(()=>window.location.replace("/login"),1200);
 }catch(error){msg.style.color="red";msg.innerText=error.message||"Unable to update password.";btn.disabled=false;btn.innerText="Update Password";}
});
</script>
{% endblock %}
