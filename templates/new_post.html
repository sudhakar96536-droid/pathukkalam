<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Post - Pathukkalam</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f0f2f5;
    padding-bottom:120px;
}

/* HEADER */

.header{
    background:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 5px rgba(0,0,0,0.08);
}

.header-title{
    font-size:22px;
    font-weight:bold;
    color:#1877f2;
}

.cancel-btn{
    text-decoration:none;
    color:#444;
    font-weight:bold;
    font-size:15px;
}

/* PROFILE */

.user-box{
    background:white;
    margin-top:10px;
    padding:15px;
    display:flex;
    align-items:center;
}

.user-box img{
    width:50px;
    height:50px;
    border-radius:50%;
    margin-right:12px;
    object-fit:cover;
}

.user-name{
    font-weight:bold;
    font-size:16px;
}

/* POST AREA */

.post-box{
    background:white;
    padding:15px;
}

.post-box textarea{
    width:100%;
    min-height:220px;
    border:none;
    resize:none;
    outline:none;
    font-size:18px;
    background:white;
    color:#222;
}

/* MEDIA PREVIEW */

.media-preview{
    display:none;
    margin-top:15px;
}

.media-preview.active{
    display:block;
}

.media-preview-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:10px;
}

.media-item{
    position:relative;
    background:#f0f2f5;
    border-radius:12px;
    overflow:hidden;
    min-height:120px;
}

.media-item img,
.media-item video{
    width:100%;
    height:220px;
    display:block;
    object-fit:cover;
    background:#000;
}

.media-item.document-item{
    min-height:110px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
}

.document-icon{
    width:50px;
    height:50px;
    border-radius:12px;
    background:#e8f1ff;
    color:#1877f2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    flex-shrink:0;
}

.document-info{
    min-width:0;
    flex:1;
}

.document-name{
    font-size:14px;
    font-weight:bold;
    color:#222;
    word-break:break-word;
}

.document-type{
    margin-top:5px;
    font-size:12px;
    color:#888;
}

.remove-media{
    position:absolute;
    top:8px;
    right:8px;
    width:34px;
    height:34px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,0.65);
    color:white;
    font-size:16px;
    cursor:pointer;
    z-index:5;
}

.media-count{
    margin-top:10px;
    font-size:12px;
    color:#777;
}

/* BOTTOM TOOLS */

.bottom-tools{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    border-top:1px solid #ddd;
    padding:15px;
    z-index:1000;
}

.tool-options{
    display:flex;
    justify-content:space-around;
    margin-bottom:15px;
}

.tool-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    font-size:13px;
    color:#444;
    cursor:pointer;
}

.tool-btn i{
    font-size:24px;
    margin-bottom:6px;
}

.post-submit{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#1877f2;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.post-submit:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.message{
    text-align:center;
    margin-top:12px;
    font-size:14px;
}

.hidden-input{
    display:none;
}

@media(max-width:600px){

    .media-preview-grid{
        grid-template-columns:1fr;
    }

    .media-item img,
    .media-item video{
        height:280px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <a href="/" class="cancel-btn">
        Cancel
    </a>

    <div class="header-title">
        Create Post
    </div>

    <div style="width:55px;"></div>

</div>


<!-- USER -->

<div class="user-box">

    <img
        id="userProfile"
        src="https://i.pravatar.cc/150?img=10">

    <div
        class="user-name"
        id="userName">

        Loading...

    </div>

</div>


<!-- POST AREA -->

<div class="post-box">

    <textarea
        id="caption"
        placeholder="What's happening in Pathukkalam?"></textarea>


    <!-- MEDIA PREVIEW -->

    <div
        id="mediaPreview"
        class="media-preview">

        <div
            id="mediaPreviewGrid"
            class="media-preview-grid">
        </div>

        <div
            id="mediaCount"
            class="media-count">
        </div>

    </div>


    <!-- IMAGE INPUT -->

    <input
        type="file"
        id="imageInput"
        class="hidden-input"
        accept="image/jpeg,image/png,image/webp"
        multiple>


    <!-- VIDEO INPUT -->

    <input
        type="file"
        id="videoInput"
        class="hidden-input"
        accept="video/*">


    <!-- DOCUMENT INPUT -->

    <input
        type="file"
        id="documentInput"
        class="hidden-input"
        accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip">


    <div
        id="message"
        class="message">
    </div>

</div>


<!-- BOTTOM TOOLS -->

<div class="bottom-tools">

    <div class="tool-options">


        <!-- PHOTO -->

        <label
            class="tool-btn"
            for="imageInput">

            <i class="fas fa-image"></i>

            <span>Photo</span>

        </label>


        <!-- VIDEO -->

        <label
            class="tool-btn"
            for="videoInput">

            <i class="fas fa-video"></i>

            <span>Video</span>

        </label>


        <!-- DOCUMENT -->

        <label
            class="tool-btn"
            for="documentInput">

            <i class="fas fa-file"></i>

            <span>Document</span>

        </label>

    </div>


    <button
        type="button"
        id="postButton"
        class="post-submit">

        Post Now

    </button>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://jxpvkamxtedgzztozonl.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_DCI0qvAlYNBpWi8DZkZF2g_frSEW_OX";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* -----------------------------------------
   MEDIA SETTINGS
----------------------------------------- */

const MAX_IMAGE_SIZE =
    5 * 1024 * 1024;

const MAX_VIDEO_SIZE =
    50 * 1024 * 1024;

const MAX_DOCUMENT_SIZE =
    20 * 1024 * 1024;


/*
   Selected media are kept separately from
   the existing posting logic.
*/
let selectedImages = [];
let selectedVideo = null;
let selectedDocument = null;


/* -----------------------------------------
   LOAD CURRENT USER
----------------------------------------- */

async function loadUser(){

    const {
        data: {
            user
        }
    } =
    await supabaseClient.auth.getUser();


    if(!user){

        window.location.href = "/login";

        return;

    }


    console.log(
        "Logged in user:",
        user
    );


    const {
        data: profile,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "name, username, profile_url"
        )
        .eq(
            "id",
            user.id
        )
        .single();


    if(error){

        console.error(
            "Profile loading error:",
            error
        );

        document.getElementById(
            "userName"
        ).innerText =
            user.email;

        return;

    }


    document.getElementById(
        "userName"
    ).innerText =
        profile.name || profile.username;


    if(profile.profile_url){

        document.getElementById(
            "userProfile"
        ).src =
            profile.profile_url;

    }

}


/* -----------------------------------------
   IMAGE SELECT
----------------------------------------- */

document.getElementById(
    "imageInput"
).addEventListener(
    "change",
    function(){

        const files =
            Array.from(this.files || []);


        if(!files.length){

            return;

        }


        /*
        Images can be selected multiple times.
        Existing selected images are retained.
        */

        for(const file of files){

            if(
                !file.type.startsWith("image/")
            ){

                alert(
                    "Only image files are allowed."
                );

                continue;

            }


            if(
                file.size >
                MAX_IMAGE_SIZE
            ){

                alert(
                    file.name +
                    " must be smaller than 5 MB."
                );

                continue;

            }


            selectedImages.push(file);

        }


        renderMediaPreview();


        /*
        Reset the input so the same image can
        be selected again later if required.
        */

        this.value = "";

    }
);


/* -----------------------------------------
   VIDEO SELECT
----------------------------------------- */

document.getElementById(
    "videoInput"
).addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file){

            return;

        }


        if(
            !file.type.startsWith("video/")
        ){

            alert(
                "Please select a video file."
            );

            this.value = "";

            return;

        }


        if(
            file.size >
            MAX_VIDEO_SIZE
        ){

            alert(
                "Video must be smaller than 50 MB."
            );

            this.value = "";

            return;

        }


        /*
        One video per post.
        Selecting another video replaces
        the previously selected video.
        */

        selectedVideo =
            file;


        /*
        Video and document are mutually
        exclusive media types.
        */

        selectedDocument =
            null;


        renderMediaPreview();


        this.value = "";

    }
);


/* -----------------------------------------
   DOCUMENT SELECT
----------------------------------------- */

document.getElementById(
    "documentInput"
).addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file){

            return;

        }


        if(
            file.size >
            MAX_DOCUMENT_SIZE
        ){

            alert(
                "Document must be smaller than 20 MB."
            );

            this.value = "";

            return;

        }


        selectedDocument =
            file;


        /*
        Document and video are mutually
        exclusive media types.
        */

        selectedVideo =
            null;


        renderMediaPreview();


        this.value = "";

    }
);


/* -----------------------------------------
   RENDER MEDIA PREVIEW
----------------------------------------- */

function renderMediaPreview(){

    const preview =
        document.getElementById(
            "mediaPreview"
        );

    const grid =
        document.getElementById(
            "mediaPreviewGrid"
        );

    const count =
        document.getElementById(
            "mediaCount"
        );


    grid.innerHTML = "";


    /*
    ======================================
    IMAGES
    ======================================
    */

    selectedImages.forEach(
        function(file,index){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "media-item";


            const img =
                document.createElement(
                    "img"
                );

            img.src =
                URL.createObjectURL(
                    file
                );

            img.alt =
                "Selected image";


            const remove =
                document.createElement(
                    "button"
                );

            remove.type =
                "button";

            remove.className =
                "remove-media";

            remove.innerHTML =
                '<i class="fas fa-times"></i>';


            remove.addEventListener(
                "click",
                function(){

                    selectedImages.splice(
                        index,
                        1
                    );

                    renderMediaPreview();

                }
            );


            item.appendChild(img);

            item.appendChild(remove);

            grid.appendChild(item);

        }
    );


    /*
    ======================================
    VIDEO
    ======================================
    */

    if(selectedVideo){

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "media-item";


        const video =
            document.createElement(
                "video"
            );

        video.src =
            URL.createObjectURL(
                selectedVideo
            );

        video.controls =
            true;

        video.preload =
            "metadata";


        const remove =
            document.createElement(
                "button"
            );

        remove.type =
            "button";

        remove.className =
            "remove-media";

        remove.innerHTML =
            '<i class="fas fa-times"></i>';


        remove.addEventListener(
            "click",
            function(){

                selectedVideo =
                    null;

                renderMediaPreview();

            }
        );


        item.appendChild(video);

        item.appendChild(remove);

        grid.appendChild(item);

    }


    /*
    ======================================
    DOCUMENT
    ======================================
    */

    if(selectedDocument){

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "media-item document-item";


        const icon =
            document.createElement(
                "div"
            );

        icon.className =
            "document-icon";

        icon.innerHTML =
            '<i class="fas fa-file-lines"></i>';


        const info =
            document.createElement(
                "div"
            );

        info.className =
            "document-info";


        const name =
            document.createElement(
                "div"
            );

        name.className =
            "document-name";

        name.innerText =
            selectedDocument.name;


        const type =
            document.createElement(
                "div"
            );

        type.className =
            "document-type";

        type.innerText =
            formatFileSize(
                selectedDocument.size
            );


        info.appendChild(name);

        info.appendChild(type);


        const remove =
            document.createElement(
                "button"
            );

        remove.type =
            "button";

        remove.className =
            "remove-media";

        remove.innerHTML =
            '<i class="fas fa-times"></i>';


        remove.addEventListener(
            "click",
            function(){

                selectedDocument =
                    null;

                renderMediaPreview();

            }
        );


        item.appendChild(icon);

        item.appendChild(info);

        item.appendChild(remove);

        grid.appendChild(item);

    }


    const total =
        selectedImages.length +
        (selectedVideo ? 1 : 0) +
        (selectedDocument ? 1 : 0);


    if(total > 0){

        preview.classList.add(
            "active"
        );


        if(
            selectedVideo &&
            selectedImages.length
        ){

            count.innerText =
                selectedImages.length +
                " image(s) + 1 video";

        }
        else if(selectedVideo){

            count.innerText =
                "1 video selected";

        }
        else if(selectedDocument){

            count.innerText =
                "1 document selected";

        }
        else{

            count.innerText =
                selectedImages.length +
                (
                    selectedImages.length === 1
                        ? " image selected"
                        : " images selected"
                );

        }

    }
    else{

        preview.classList.remove(
            "active"
        );

        count.innerText =
            "";

    }

}


/* -----------------------------------------
   FILE SIZE
----------------------------------------- */

function formatFileSize(bytes){

    if(bytes < 1024){

        return bytes +
            " B";

    }


    if(bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(1) +
        " KB";

    }


    return (
        bytes /
        (1024 * 1024)
    ).toFixed(1) +
    " MB";

}


/* -----------------------------------------
   CREATE POST
----------------------------------------- */

document.getElementById(
    "postButton"
).addEventListener(
    "click",
    async function(){

        const button =
            document.getElementById(
                "postButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const caption =
            document.getElementById(
                "caption"
            ).value.trim();


        const hasMedia =
            selectedImages.length > 0 ||
            !!selectedVideo ||
            !!selectedDocument;


        if(!caption && !hasMedia){

            message.style.color =
                "red";

            message.innerText =
                "Please write something or select a photo, video or document.";

            return;

        }


        button.disabled = true;

        button.innerText =
            "Posting...";


        message.innerText = "";


        try{

            /* ---------------------------------
               GET CURRENT USER
            --------------------------------- */

            const {
                data: {
                    user
                }
            } =
            await supabaseClient.auth.getUser();


            if(!user){

                throw new Error(
                    "Please login first."
                );

            }


            /*
            ==================================
            UPLOAD ALL SELECTED MEDIA
            ==================================
            */

            const uploadedMedia = [];


            /*
            ----------------------------------
            UPLOAD IMAGES
            ----------------------------------
            */

            for(
                const imageFile
                of selectedImages
            ){

                const extension =
                    imageFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();


                const fileName =
                    user.id +
                    "/post_" +
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2,8) +
                    "." +
                    extension;


                console.log(
                    "Uploading image:",
                    fileName
                );


                const {
                    error: uploadError
                } =
                await supabaseClient
                    .storage
                    .from("post-images")
                    .upload(
                        fileName,
                        imageFile,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false,

                            contentType:
                                imageFile.type
                        }
                    );


                if(uploadError){

                    throw uploadError;

                }


                const {
                    data: publicUrlData
                } =
                supabaseClient
                    .storage
                    .from("post-images")
                    .getPublicUrl(
                        fileName
                    );


                uploadedMedia.push({

                    type:
                        "image",

                    url:
                        publicUrlData.publicUrl,

                    name:
                        imageFile.name

                });

            }


            /*
            ----------------------------------
            UPLOAD VIDEO
            ----------------------------------
            */

            if(selectedVideo){

                const extension =
                    selectedVideo.name
                    .split(".")
                    .pop()
                    .toLowerCase();


                const fileName =
                    user.id +
                    "/video_" +
                    Date.now() +
                    "." +
                    extension;


                console.log(
                    "Uploading video:",
                    fileName
                );


                const {
                    error: uploadError
                } =
                await supabaseClient
                    .storage
                    .from("post-images")
                    .upload(
                        fileName,
                        selectedVideo,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false,

                            contentType:
                                selectedVideo.type
                        }
                    );


                if(uploadError){

                    throw uploadError;

                }


                const {
                    data: publicUrlData
                } =
                supabaseClient
                    .storage
                    .from("post-images")
                    .getPublicUrl(
                        fileName
                    );


                uploadedMedia.push({

                    type:
                        "video",

                    url:
                        publicUrlData.publicUrl,

                    name:
                        selectedVideo.name

                });

            }


            /*
            ----------------------------------
            UPLOAD DOCUMENT
            ----------------------------------
            */

            if(selectedDocument){

                const extension =
                    selectedDocument.name
                    .split(".")
                    .pop()
                    .toLowerCase();


                const fileName =
                    user.id +
                    "/document_" +
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2,8) +
                    "." +
                    extension;


                console.log(
                    "Uploading document:",
                    fileName
                );


                const {
                    error: uploadError
                } =
                await supabaseClient
                    .storage
                    .from("post-images")
                    .upload(
                        fileName,
                        selectedDocument,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false,

                            contentType:
                                selectedDocument.type ||
                                "application/octet-stream"
                        }
                    );


                if(uploadError){

                    throw uploadError;

                }


                const {
                    data: publicUrlData
                } =
                supabaseClient
                    .storage
                    .from("post-images")
                    .getPublicUrl(
                        fileName
                    );


                uploadedMedia.push({

                    type:
                        "document",

                    url:
                        publicUrlData.publicUrl,

                    name:
                        selectedDocument.name

                });

            }


            /*
            ==================================
            INSERT POST
            ==================================

            The old image_url column is retained
            for compatibility with the existing
            Pathukkalam post system.

            New media is additionally stored in
            media_urls and media_type.

            ==================================
            */

            const firstMedia =
                uploadedMedia.length
                    ? uploadedMedia[0]
                    : null;


            const {
                data,
                error
            } =
            await supabaseClient
                .from("posts")
                .insert({

                    user_id:
                        user.id,

                    caption:
                        caption || null,

                    image_url:
                        firstMedia?.type === "image"
                            ? firstMedia.url
                            : null,

                    media_urls:
                        uploadedMedia.length
                            ? uploadedMedia
                            : null,

                    media_type:
                        firstMedia?.type ||
                        null

                })
                .select()
                .single();


            if(error){

                throw error;

            }


            console.log(
                "Post created:",
                data
            );


            message.style.color =
                "green";

            message.innerText =
                "Post created successfully!";


            setTimeout(
                function(){

                    window.location.href =
                        "/";

                },
                800
            );


        }
        catch(error){

            console.error(
                "Post creation error:",
                error
            );


            message.style.color =
                "red";

            message.innerText =
                error.message;

        }


        button.disabled = false;

        button.innerText =
            "Post Now";

    }
);


/* -----------------------------------------
   LOAD USER
----------------------------------------- */

loadUser();

</script>

</body>

</html>
