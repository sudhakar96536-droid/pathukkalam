<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Post - Pathukkalam</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f0f2f5;
    padding-bottom:120px;
}

/* HEADER */

.header{
    background:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 5px rgba(0,0,0,0.08);
}

.header-title{
    font-size:22px;
    font-weight:bold;
    color:#1877f2;
}

.cancel-btn{
    text-decoration:none;
    color:#444;
    font-weight:bold;
    font-size:15px;
}

/* PROFILE */

.user-box{
    background:white;
    margin-top:10px;
    padding:15px;
    display:flex;
    align-items:center;
}

.user-box img{
    width:50px;
    height:50px;
    border-radius:50%;
    margin-right:12px;
    object-fit:cover;
}

.user-name{
    font-weight:bold;
    font-size:16px;
}

/* POST AREA */

.post-box{
    background:white;
    padding:15px;
}

.post-box textarea{
    width:100%;
    min-height:220px;
    border:none;
    resize:none;
    outline:none;
    font-size:18px;
    background:white;
    color:#222;
}

/* IMAGE PREVIEW */

.image-preview{
    display:none;
    margin-top:15px;
    position:relative;
}

.image-preview img{
    width:100%;
    max-height:400px;
    object-fit:cover;
    border-radius:12px;
}

.remove-image{
    position:absolute;
    top:10px;
    right:10px;
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,0.65);
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* BOTTOM TOOLS */

.bottom-tools{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    border-top:1px solid #ddd;
    padding:15px;
    z-index:1000;
}

.tool-options{
    display:flex;
    justify-content:space-around;
    margin-bottom:15px;
}

.tool-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    font-size:13px;
    color:#444;
    cursor:pointer;
}

.tool-btn i{
    font-size:24px;
    margin-bottom:6px;
}

.post-submit{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#1877f2;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.post-submit:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.message{
    text-align:center;
    margin-top:12px;
    font-size:14px;
}

.hidden-input{
    display:none;
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <a href="/" class="cancel-btn">
        Cancel
    </a>

    <div class="header-title">
        Create Post
    </div>

    <div style="width:55px;"></div>

</div>


<!-- USER -->

<div class="user-box">

    <img
        id="userProfile"
        src="https://i.pravatar.cc/150?img=10">

    <div
        class="user-name"
        id="userName">

        Loading...

    </div>

</div>


<!-- POST AREA -->

<div class="post-box">

    <textarea
        id="caption"
        placeholder="What's happening in Pathukkalam?"></textarea>


    <!-- IMAGE PREVIEW -->

    <div
        id="imagePreview"
        class="image-preview">

        <img
            id="previewImage"
            src="">

        <button
            type="button"
            id="removeImage"
            class="remove-image">

            <i class="fas fa-times"></i>

        </button>

    </div>


    <input
        type="file"
        id="imageInput"
        class="hidden-input"
        accept="image/jpeg,image/png,image/webp">


    <div
        id="message"
        class="message">
    </div>

</div>


<!-- BOTTOM TOOLS -->

<div class="bottom-tools">

    <div class="tool-options">

        <label
            class="tool-btn"
            for="imageInput">

            <i class="fas fa-image"></i>

            <span>Photo</span>

        </label>


        <div class="tool-btn">

            <i class="fas fa-video"></i>

            <span>Video</span>

        </div>


        <div class="tool-btn">

            <i class="fas fa-file"></i>

            <span>Document</span>

        </div>

    </div>


    <button
        type="button"
        id="postButton"
        class="post-submit">

        Post Now

    </button>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://jxpvkamxtedgzztozonl.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_DCI0qvAlYNBpWi8DZkZF2g_frSEW_OX";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* -----------------------------------------
   LOAD CURRENT USER
----------------------------------------- */

async function loadUser(){

    const {
        data: {
            user
        }
    } =
    await supabaseClient.auth.getUser();


    if(!user){

        window.location.href = "/login";

        return;

    }


    console.log(
        "Logged in user:",
        user
    );


    const {
        data: profile,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "name, username, profile_url"
        )
        .eq(
            "id",
            user.id
        )
        .single();


    if(error){

        console.error(
            "Profile loading error:",
            error
        );

        document.getElementById(
            "userName"
        ).innerText =
            user.email;

        return;

    }


    document.getElementById(
        "userName"
    ).innerText =
        profile.name || profile.username;


    if(profile.profile_url){

        document.getElementById(
            "userProfile"
        ).src =
            profile.profile_url;

    }

}


/* -----------------------------------------
   IMAGE SELECT
----------------------------------------- */

document.getElementById(
    "imageInput"
).addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file){

            return;

        }


        /* Maximum 5 MB */

        if(file.size > 5 * 1024 * 1024){

            alert(
                "Image must be smaller than 5 MB."
            );

            this.value = "";

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                document.getElementById(
                    "previewImage"
                ).src =
                    event.target.result;


                document.getElementById(
                    "imagePreview"
                ).style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


/* -----------------------------------------
   REMOVE IMAGE
----------------------------------------- */

document.getElementById(
    "removeImage"
).addEventListener(
    "click",
    function(){

        document.getElementById(
            "imageInput"
        ).value = "";


        document.getElementById(
            "previewImage"
        ).src = "";


        document.getElementById(
            "imagePreview"
        ).style.display =
            "none";

    }
);


/* -----------------------------------------
   CREATE POST
----------------------------------------- */

document.getElementById(
    "postButton"
).addEventListener(
    "click",
    async function(){

        const button =
            document.getElementById(
                "postButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const caption =
            document.getElementById(
                "caption"
            ).value.trim();


        const imageFile =
            document.getElementById(
                "imageInput"
            ).files[0];


        if(!caption && !imageFile){

            message.style.color =
                "red";

            message.innerText =
                "Please write something or select a photo.";

            return;

        }


        button.disabled = true;

        button.innerText =
            "Posting...";


        message.innerText = "";


        try{

            /* ---------------------------------
               GET CURRENT USER
            --------------------------------- */

            const {
                data: {
                    user
                }
            } =
            await supabaseClient.auth.getUser();


            if(!user){

                throw new Error(
                    "Please login first."
                );

            }


            let imageUrl = null;


            /* ---------------------------------
               UPLOAD IMAGE
            --------------------------------- */

            if(imageFile){

                const extension =
                    imageFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();


                const fileName =
                    user.id +
                    "/" +
                    Date.now() +
                    "." +
                    extension;


                console.log(
                    "Uploading:",
                    fileName
                );


                const {
                    error: uploadError
                } =
                await supabaseClient
                    .storage
                    .from("post-images")
                    .upload(
                        fileName,
                        imageFile,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false,

                            contentType:
                                imageFile.type
                        }
                    );


                if(uploadError){

                    throw uploadError;

                }


                /* ---------------------------------
                   GET PUBLIC URL
                --------------------------------- */

                const {
                    data: publicUrlData
                } =
                supabaseClient
                    .storage
                    .from("post-images")
                    .getPublicUrl(
                        fileName
                    );


                imageUrl =
                    publicUrlData.publicUrl;


                console.log(
                    "Image URL:",
                    imageUrl
                );

            }


            /* ---------------------------------
               INSERT POST
            --------------------------------- */

            const {
                data,
                error
            } =
            await supabaseClient
                .from("posts")
                .insert({

                    user_id:
                        user.id,

                    caption:
                        caption || null,

                    image_url:
                        imageUrl

                })
                .select()
                .single();


            if(error){

                throw error;

            }


            console.log(
                "Post created:",
                data
            );


            message.style.color =
                "green";

            message.innerText =
                "Post created successfully!";


            setTimeout(
                function(){

                    window.location.href =
                        "/";

                },
                800
            );


        }
        catch(error){

            console.error(
                "Post creation error:",
                error
            );


            message.style.color =
                "red";

            message.innerText =
                error.message;

        }


        button.disabled = false;

        button.innerText =
            "Post Now";

    }
);


/* -----------------------------------------
   LOAD USER
----------------------------------------- */

loadUser();

</script>

</body>

</html>
