{% extends "base.html" %}

{% block title %}Forgot Password - Pathukkalam{% endblock %}

{% block head %}
<style>
*{box-sizing:border-box;}
body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.box{width:100%;max-width:400px;background:white;padding:30px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,.08);}
.logo{text-align:center;margin-bottom:25px;} .logo img{width:75px;height:75px;border-radius:18px;} .logo h1{color:#1877f2;margin:10px 0 5px;} .logo p{color:gray;}
label{display:block;margin-bottom:8px;font-size:14px;font-weight:bold;color:#444;}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;outline:none;font-size:15px;}
input:focus{border-color:#1877f2;}
button{width:100%;padding:15px;margin-top:20px;border:0;border-radius:14px;background:#1877f2;color:white;font-size:16px;font-weight:bold;cursor:pointer;}
button:disabled{opacity:.6;cursor:not-allowed;}
.message{text-align:center;margin-top:15px;font-size:14px;line-height:1.5;min-height:20px;}
.back{text-align:center;margin-top:20px;font-size:14px;} .back a{color:#1877f2;text-decoration:none;font-weight:bold;}
</style>
{% endblock %}

{% block content %}
<div class="box">
<div class="logo"><img src="{{ url_for('static', filename='icon-192.png') }}"><h1>Pathukkalam</h1><p>Reset your password 🔐</p></div>
<form id="forgotForm">
<label for="email">Email Address</label>
<input type="email" id="email" placeholder="Enter your registered email" autocomplete="email" required>
<button type="submit" id="sendBtn">Send Reset Link</button>
<div id="message" class="message"></div>
</form>
<div class="back"><a href="/login">← Back to Login</a></div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=supabase.createClient("https://jxpvkamxtedgzztozonl.supabase.co","sb_publishable_DCI0qvAlYNBpWi8DZkZF2g_frSEW_OX");
document.getElementById("forgotForm").addEventListener("submit",async function(e){
 e.preventDefault(); const email=document.getElementById("email").value.trim(); const btn=document.getElementById("sendBtn"); const msg=document.getElementById("message");
 btn.disabled=true; btn.innerText="Sending..."; msg.innerText="";
 try{
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+"/reset-password"});
  if(error) throw error;
  msg.style.color="green"; msg.innerText="If this email is registered, a reset link has been sent. Please check your inbox and spam folder.";
 }catch(error){ msg.style.color="red"; msg.innerText=error.message||"Unable to send reset link."; }
 finally{btn.disabled=false;btn.innerText="Send Reset Link";}
});
</script>
{% endblock %}
