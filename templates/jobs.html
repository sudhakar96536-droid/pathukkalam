<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://jxpvkamxtedgzztozonl.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_DCI0qvAlYNBpWi8DZkZF2g_frSEW_OX";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let currentProfile = null;

let allJobsData = [];

let myJobsData = [];

let likedJobIds = new Set();

let appliedJobsData = [];

let searchText = "";

let currentView = "all";


/* =========================================================
   ELEMENTS
========================================================= */

const searchInput =
    document.getElementById("searchInput");

const postForm =
    document.getElementById("postForm");

const allJobsContainer =
    document.getElementById("allJobsContainer");

const postedJobsContainer =
    document.getElementById("postedJobsContainer");

const likedJobsContainer =
    document.getElementById("likedJobsContainer");

const appliedJobsContainer =
    document.getElementById("appliedJobsContainer");


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.innerText =
        message;

    toast.classList.add("show");

    setTimeout(
        function(){

            toast.classList.remove("show");

        },
        3000
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(dateValue){

    if(!dateValue){

        return "";

    }

    const date =
        new Date(dateValue);

    if(Number.isNaN(date.getTime())){

        return "";

    }

    return date.toLocaleDateString(
        "en-IN",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   TIME AGO
========================================================= */

function timeAgo(dateValue){

    if(!dateValue){

        return "";

    }

    const date =
        new Date(dateValue);

    const now =
        new Date();

    const seconds =
        Math.floor(
            (now - date) / 1000
        );


    if(seconds < 60){

        return "just now";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    if(minutes < 60){

        return minutes +
            " min ago";

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    if(hours < 24){

        return hours +
            " hr ago";

    }


    const days =
        Math.floor(
            hours / 24
        );


    if(days < 30){

        return days +
            " day" +
            (days === 1 ? "" : "s") +
            " ago";

    }


    return formatDate(
        dateValue
    );

}


/* =========================================================
   PROFILE URL
========================================================= */

function profileUrl(username){

    if(!username){

        return "#";

    }

    return (
        "/profile/" +
        encodeURIComponent(
            username
        )
    );

}


/* =========================================================
   CURRENT USER
========================================================= */

async function loadCurrentUser(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(
        error ||
        !data.user
    ){

        window.location.href =
            "/login";

        return false;

    }


    currentUser =
        data.user;


    const {
        data:profile,
        error:profileError
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            name,
            profile_url
        `)
        .eq(
            "id",
            currentUser.id
        )
        .single();


    if(profileError){

        console.error(
            "Profile loading error:",
            profileError
        );

        showToast(
            "Unable to load your profile."
        );

        return false;

    }


    currentProfile =
        profile;


    return true;

}


/* =========================================================
   LOAD ALL JOBS
========================================================= */

async function loadAllJobs(){

    allJobsContainer.innerHTML = `

        <div class="loading">

            <i class="fas fa-spinner fa-spin"></i>

            <div>
                Loading latest jobs...
            </div>

        </div>

    `;


    const {
        data:jobs,
        error
    } =
    await supabaseClient
        .from("jobs")
        .select(`
            id,
            user_id,
            job_title,
            company_name,
            designation,
            location,
            salary,
            experience,
            job_type,
            description,
            status,
            views_count,
            likes_count,
            applied_count,
            shares_count,
            whatsapp_clicks_count,
            created_at,
            updated_at
        `)
        .eq(
            "status",
            "active"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Jobs loading error:",
            error
        );

        allJobsContainer.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-circle-exclamation"></i>

                <div class="empty-title">
                    Unable to load jobs
                </div>

                <div class="empty-text">
                    ${escapeHtml(error.message)}
                </div>

            </div>

        `;

        return;

    }


    allJobsData =
        jobs || [];


    await attachProfiles(
        allJobsData
    );

}


/* =========================================================
   LOAD MY JOBS
========================================================= */

async function loadMyJobs(){

    const {
        data:jobs,
        error
    } =
    await supabaseClient
        .from("jobs")
        .select(`
            id,
            user_id,
            job_title,
            company_name,
            designation,
            location,
            salary,
            experience,
            job_type,
            description,
            status,
            views_count,
            likes_count,
            applied_count,
            shares_count,
            whatsapp_clicks_count,
            created_at,
            updated_at
        `)
        .eq(
            "user_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "My jobs error:",
            error
        );

        myJobsData = [];

        return;

    }


    myJobsData =
        jobs || [];


    await attachProfiles(
        myJobsData
    );

}


/* =========================================================
   ATTACH PROFILES
========================================================= */

async function attachProfiles(
    jobs
){

    const userIds =
        [
            ...new Set(
                jobs
                    .map(
                        job =>
                            job.user_id
                    )
                    .filter(Boolean)
            )
        ];


    if(!userIds.length){

        return;

    }


    const {
        data:profiles,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            name,
            profile_url
        `)
        .in(
            "id",
            userIds
        );


    if(error){

        console.error(
            "Profiles error:",
            error
        );

        return;

    }


    const profileMap =
        new Map();


    (
        profiles || []
    ).forEach(
        profile => {

            profileMap.set(

            );

        }
    );


    jobs.forEach(
        job => {

                    job.user_id
                ) || null;

        }
    );

}

/* =========================================================
   SEARCH MATCH
========================================================= */

function jobMatchesSearch(
    job
){

    if(!searchText){

        return true;

    }


    const profile =
        job.profile || {};


    const searchable =
        [

            job.job_title,

            job.company_name,

            job.designation,

            job.location,

            job.salary,

            job.experience,

            job.job_type,

            job.description,

            profile.name,

            profile.username

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


    return searchable.includes(
        searchText
    );

}

async function renderAppliedJobs(){

    appliedJobsContainer.innerHTML = `

        <div class="loading">

            <i class="fas fa-spinner fa-spin"></i>

            <div>
                Loading your applications...
            </div>

        </div>

    `;


    const jobIds =
        appliedJobsData.map(
            item =>
                Number(
                    item.job_id
                )
        );


    if(!jobIds.length){

        appliedJobsContainer.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-file-signature"></i>

                <div class="empty-title">

                    No applications yet

                </div>

                <div class="empty-text">

                    Jobs you apply for will appear here.

                </div>

            </div>

        `;

        return;

    }


    const {
        data:jobs,
        error
    } =
    await supabaseClient
        .from("jobs")
        .select(`
            id,
            user_id,
            job_title,
            company_name,
            designation,
            location,
            salary,
            experience,
            job_type,
            description,
            status,
            views_count,
            likes_count,
            applied_count,
            shares_count,
            whatsapp_clicks_count,
            created_at,
            updated_at
        `)
        .in(
            "id",
            jobIds
        );


    if(error){

        console.error(
            "Applied jobs error:",
            error
        );

        appliedJobsContainer.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-circle-exclamation"></i>

                <div class="empty-title">

                    Unable to load applications

                </div>

                <div class="empty-text">

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            </div>

        `;

        return;

    }


    await attachProfiles(
        jobs || []
    );


    const jobMap =
        new Map();


    (
        jobs || []
    ).forEach(
        job => {

            jobMap.set(
                Number(job.id),
                job
            );

        }
    );


    appliedJobsContainer.innerHTML =
        "";


    const ordered =
        appliedJobsData
            .map(
                application => {

                    const job =
                        jobMap.get(
                            Number(
                                application.job_id
                            )
                        );

                    if(!job){

                        return null;

                    }

                    return {
                        job,
                        application
                    };

                }
            )
            .filter(Boolean)
            .filter(
                item =>
                    jobMatchesSearch(
                        item.job
                    )
            );


    if(!ordered.length){

        appliedJobsContainer.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-search"></i>

                <div class="empty-title">

                    No matching applied jobs

                </div>

            </div>

        `;

        return;

    }


    ordered.forEach(
        item => {

            const card =
                createJobCard(
                    item.job
                );


            const status =
                document.createElement(
                    "div"
                );


            status.className =
                "application-status status-" +
                escapeHtml(
                    item.application.status
                );


            if(
                item.application.status ===
                "accepted"
            ){

                status.innerHTML =
                    "✓ Application Accepted";

            }
            else if(
                item.application.status ===
                "rejected"
            ){

                status.innerHTML =
                    "✕ Application Rejected";

            }
            else if(
                item.application.status ===
                "cancelled"
            ){

                status.innerHTML =
                    "Application Cancelled";

            }
            else{

                status.innerHTML =
                    "⏳ Application Pending";

            }


            card.appendChild(
                status
            );


            appliedJobsContainer.appendChild(
                card
            );

        }
    );

}

/* =========================================================

function setView(
    view,
    button
){

    currentView =
        view;


    document
        .querySelectorAll(".top-btn")
        .forEach(
            btn => {

                btn.classList.remove(
                    "active"
                );

            }
        );


    if(button){

        button.classList.add(
            "active"
        );

    }


    postForm.style.display =
        "none";


    document.getElementById(
        "postedJobs"
    ).style.display =
        view === "posted"
            ? "block"
            : "none";


    document.getElementById(
        "likedJobs"
    ).style.display =
        view === "liked"
            ? "block"
            : "none";


    document.getElementById(
        "appliedJobs"
    ).style.display =
        view === "applied"
            ? "block"
            : "none";


    document.getElementById(
        "allJobs"
    ).style.display =
        view === "all"
            ? "block"
            : "none";


    renderCurrentView();

}

                "Unable to post job: " +
                error.message
            );

        }
        finally{

            button.disabled =
                false;

            button.innerHTML = `

                <i class="fas fa-paper-plane"></i>
                Post Job

            `;

        }

    }
);


/* =========================================================
   LIKE / UNLIKE
========================================================= */

async function toggleJobLike(
    job,
    button
){

    if(!currentUser){

        window.location.href =
            "/login";

        return;

    }


    button.disabled =
        true;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .rpc(
                "job_toggle_like",
                {
                    p_job_id:
                        job.id
                }
            );


        if(error){

            throw error;

        }


        const liked =
            data === true;


        if(liked){

            likedJobIds.add(
                Number(job.id)
            );

            job.likes_count =
                Number(
                    job.likes_count || 0
                ) + 1;


            if(
                job.user_id !==
                currentUser.id
            ){

                await createNotification({

                    receiverId:
                        job.user_id,

                    type:
                        "job_like",

                    message:
                        (
                            currentProfile?.name ||
                            currentProfile?.username ||
                            "Someone"
                        ) +
                        " liked your job post: " +
                        job.job_title

                });

            }


            showToast(
                "Job liked ❤️"
            );

        }
        else{

            likedJobIds.delete(
                Number(job.id)
            );

            job.likes_count =
                Math.max(
                    Number(
                        job.likes_count || 0
                    ) - 1,
                    0
                );


            showToast(
                "Job unliked"
            );

        }


        button.classList.toggle(
            "liked",
            liked
        );


        renderCurrentView();

    }
    catch(error){

        console.error(
            "Like error:",
            error
        );

        showToast(
            "Unable to like job: " +
            error.message
        );

    }
    finally{

        button.disabled =
            false;

    }

}


/* =========================================================
   APPLY FOR JOB
========================================================= */

async function applyForJob(
    job,
    button
){

    if(!currentUser){

        window.location.href =
            "/login";

        return;

    }


    const message =
        prompt(
            "Optional message to the job poster:"
        );


    if(message === null){

        return;

    }


    button.disabled =
        true;


    button.innerHTML = `

        <i class="fas fa-spinner fa-spin"></i>
        Applying...

    `;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .rpc(
                "job_apply",
                {
                    p_job_id:
                        job.id,

                    p_message:
                        message ||
                        null
                }
            );


        if(error){

            throw error;

        }


        appliedJobsData.push({

            id:
                data,

            job_id:
                job.id,

            applicant_id:
                currentUser.id,

            status:
                "pending",

            message:
                message ||
                null,

            created_at:
                new Date().toISOString()

        });


        job.applied_count =
            Number(
                job.applied_count || 0
            ) + 1;


        await createNotification({

            receiverId:
                job.user_id,

            type:
                "job_application",

            message:
                (
                    currentProfile?.name ||
                    currentProfile?.username ||
                    "Someone"
                ) +
                " applied for your job: " +
                job.job_title

        });


        showToast(
            "Job application sent! ✓"
        );


        renderCurrentView();

    }
    catch(error){

        console.error(
            "Application error:",
            error
        );


        showToast(
            "Unable to apply: " +
            error.message
        );


        button.disabled =
            false;

        button.innerHTML = `

            <i class="fas fa-paper-plane"></i>
            Apply

        `;

    }

}


/* =========================================================
   SHARE JOB
========================================================= */

async function shareJob(
    job
){

    const url =
        window.location.origin +
        "/jobs?job=" +
        encodeURIComponent(
            job.id
        );


    try{

        const {
            error
        } =
        await supabaseClient
            .rpc(
                "job_record_share",
                {
                    p_job_id:
                        job.id
                }
            );


        if(error){

            console.error(
                "Share tracking error:",
                error
            );

        }


        job.shares_count =
            Number(
                job.shares_count || 0
            ) + 1;


        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    job.job_title,

                text:
                    "Check this job on Pathukkalam",

                url:
                    url

            });

        }
        else{

            await navigator.clipboard.writeText(
                url
            );

            showToast(
                "Job link copied! ✓"
            );

        }

    }
    catch(error){

        if(
            error.name !==
            "AbortError"
        ){

            console.error(
                "Share error:",
                error
            );

            showToast(
                "Unable to share job."
            );

        }

    }

}

========================================================= */

async function changeJobStatus(
    job,
    newStatus
){

    const text =
        newStatus === "active"
            ? "Activate this job?"
            : "Hide this job?";


    if(!confirm(text)){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from("jobs")
            .update({

                status:
                    newStatus,

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                job.id
            )
            .eq(
                "user_id",
                currentUser.id
            );


        if(error){

            throw error;

        }


        job.status =
            newStatus;

            newStatus === "active"

        );

        renderCurrentView();

    }
    catch(error){

        console.error(
            "Job status error:",
            error
        );

        showToast(
            "Unable to change job status: " +
            error.message
        );

    }

}


/* =========================================================
   LOAD APPLICANTS FOR OWNER
========================================================= */

async function loadJobApplicants(
    job,
    container
){

    if(!container){

        return;

    }


    const {
        data:applications,
        error
    } =
    await supabaseClient
        .from("job_applications")
        .select(`
            id,
            applicant_id,
            status,
            message,
            created_at,
            updated_at
        `)
        .eq(
            "job_id",
            job.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        container.innerHTML = `

            <div
                style="
                    color:#c62828;
                    font-size:12px;
                ">

                Unable to load applicants.

            </div>

        `;

        console.error(
            "Applicants error:",
            error
        );

        return;

    }


    if(!applications?.length){

        container.innerHTML = `

            <div
                style="
                    color:#888;
                    font-size:12px;
                ">

                No applicants yet.

            </div>

        `;

        return;

    }


    const applicantIds =
        [
            ...new Set(
                applications.map(
                    item =>
                        item.applicant_id
                )
            )
        ];


    const {
        data:profiles,
        error:profileError
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            name,
            profile_url
        `)
        .in(
            "id",
            applicantIds
        );


    if(profileError){

        console.error(
            "Applicant profiles error:",
            profileError
        );

    }


    const profileMap =
        new Map();


    (
        profiles || []
    ).forEach(
        profile => {

            profileMap.set(
                profile.id,
                profile
            );

        }
    );


    container.innerHTML =
        "";


    applications.forEach(
        application => {

            const profile =
                profileMap.get(
                    application.applicant_id
                ) || {};


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "applicant";


            const avatar =
                profile.profile_url ||
                "https://i.pravatar.cc/100";


            const name =
                profile.name ||
                profile.username ||
                "User";


            let actions = `

                <button
                    class="applicant-action view-applicant"
                    data-view-applicant="${escapeHtml(
                        profile.username || ""
                    )}">

                    View

                </button>

            `;


            if(
                application.status ===
                "pending"
            ){

                actions += `

                    <button
                        class="applicant-action accept-applicant"
                        data-accept-application="${application.id}">

                        Accept

                    </button>


                    <button
                        class="applicant-action reject-applicant"
                        data-reject-application="${application.id}">

                        Reject

                    </button>

                `;

            }
            else{

                actions += `

                    <span
                        style="
                            font-size:10px;
                            font-weight:bold;
                            color:${
                                application.status ===
                                "accepted"
                                    ? "#00834f"
                                    : "#c62828"
                            };
                        ">

                        ${
                            application.status ===
                            "accepted"
                                ? "Accepted"
                                : "Rejected"
                        }

                    </span>

                `;

            }


            row.innerHTML = `

                <img
                    class="applicant-avatar"
                    src="${escapeHtml(
                        avatar
                    )}">


                <div class="applicant-info">

                    <div class="applicant-name">

                        ${escapeHtml(
                            name
                        )}

                    </div>


                    <div class="applicant-username">

                        @${escapeHtml(
                            profile.username ||
                            "user"
                        )}

                    </div>

                </div>


                <div class="applicant-actions">

                    ${actions}

                </div>

            `;


            const viewButton =
                row.querySelector(
                    "[data-view-applicant]"
                );


            if(viewButton){

                viewButton.addEventListener(
                    "click",
                    function(){

                        const username =
                            this.dataset.viewApplicant;


                        if(username){

                            window.location.href =
                                profileUrl(
                                    username
                                );

                        }

                    }
                );

            }


            const acceptButton =
                row.querySelector(
                    "[data-accept-application]"
                );


            if(acceptButton){

                acceptButton.addEventListener(
                    "click",
                    function(){

                        updateApplicationStatus(
                            job,
                            application,
                            "accepted"
                        );

                    }
                );

            }


            const rejectButton =
                row.querySelector(
                    "[data-reject-application]"
                );


            if(rejectButton){

                rejectButton.addEventListener(
                    "click",
                    function(){

                        updateApplicationStatus(
                            job,
                            application,
                            "rejected"
                        );

                    }
                );

            }


            container.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   ACCEPT / REJECT APPLICATION
========================================================= */

async function updateApplicationStatus(
    job,
    application,
    status
){

    const confirmation =
        status === "accepted"
            ? "Accept this applicant?"
            : "Reject this applicant?";


    if(!confirm(confirmation)){

        return;

    }


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .rpc(
                "job_update_application",
                {
                    p_application_id:
                        application.id,

                    p_status:
                        status
                }
            );


        if(error){

            throw error;

        }


        application.status =
            status;


        await createNotification({

            receiverId:
                application.applicant_id,

            type:
                "job_" + status,

            message:
                (
                    currentProfile?.name ||
                    currentProfile?.username ||
                    "The job poster"
                ) +
                " " +
                (
                    status === "accepted"
                        ? "accepted"
                        : "rejected"
                ) +
                " your application for " +
                job.job_title

        });


        showToast(
            status === "accepted"
                ? "Applicant accepted ✓"
                : "Applicant rejected"
        );


        await reloadEverything();

        renderCurrentView();

    }
    catch(error){

        console.error(
            "Application status error:",
            error
        );

        showToast(
            "Unable to update application: " +
            error.message
        );

    }

}


/* =========================================================
   CREATE NOTIFICATION
========================================================= */

async function createNotification({
    receiverId,
    type,
    message
}){

    if(
        !receiverId ||
        receiverId ===
        currentUser?.id
    ){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from("notifications")
            .insert({

                user_id:
                    receiverId,

                sender_id:
                    currentUser.id,

                notification_type:
                    type,

                message:
                    message,

                is_read:
                    false

            });


        if(error){

            console.error(
                "Notification error:",
                error
            );

        }

    }
    catch(error){

        console.error(
            "Notification exception:",
            error
        );

    }

}


/* =========================================================
   RELOAD EVERYTHING
========================================================= */

async function reloadEverything(){

    await Promise.all([

        loadAllJobs(),

        loadMyJobs(),

        loadLikes(),

        loadApplications()

    ]);


    renderCurrentView();

}


/* =========================================================
   INITIALIZE
========================================================= */

async function initializePage(){

    const loggedIn =
        await loadCurrentUser();


    if(!loggedIn){

        return;

    }


    await reloadEverything();


    setView(
        "all",
        document.getElementById(
            "newJobBtn"
        )
    );


    /*
       New Job button is active but
       form remains closed initially.
    */

    postForm.style.display =
        "none";

}


/* =========================================================
   PERIODIC REFRESH
========================================================= */

setInterval(
    async function(){

        if(!currentUser){

            return;

        }


        await reloadEverything();

    },
    30000
);


/* =========================================================
   START
========================================================= */

initializePage();
