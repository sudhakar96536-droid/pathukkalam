<!-- index.html -->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pathukkalam</title>

<link rel="manifest"
href="{{ url_for('static', filename='manifest.json') }}">

<meta name="theme-color"
content="#1877f2">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

/* ==========================================
   GLOBAL
========================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f0f2f5;
    padding-bottom:90px;
}


/* ==========================================
   HEADER
========================================== */

.header{
    background:white;
    padding:14px 16px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:sticky;
    top:0;

    z-index:1000;

    box-shadow:0 2px 5px rgba(0,0,0,0.08);
}

.logo-section{
    display:flex;
    align-items:center;
}

.logo-img{
    width:42px;
    height:42px;

    border-radius:12px;

    margin-right:10px;

    object-fit:cover;
}

.logo-text{
    font-size:26px;
    font-weight:bold;
    color:#1877f2;
}

.header-icons{
    display:flex;
    align-items:center;
}

.header-icons i{
    width:40px;
    height:40px;

    background:#f0f2f5;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-left:10px;

    color:#333;

    font-size:18px;
}


/* ==========================================
   CREATE POST
========================================== */

.create-post{
    background:white;
    margin-top:10px;
    padding:14px;
}

.create-top{
    display:flex;
    align-items:center;
}

.create-top img{
    width:45px;
    height:45px;

    border-radius:50%;

    margin-right:10px;
}

.create-top input{
    flex:1;

    border:none;

    background:#f0f2f5;

    padding:12px;

    border-radius:25px;

    outline:none;

    font-size:15px;
}


/* ==========================================
   QUICK MENU
========================================== */

.quick-menu{
    display:flex;
    justify-content:space-around;

    padding:10px 5px;

    gap:5px;
}

.quick-card{
    text-decoration:none;

    color:#333;

    display:flex;
    flex-direction:column;

    align-items:center;

    font-size:12px;
}

.quick-card i{
    font-size:22px;

    margin-bottom:5px;
}


/* ==========================================
   STORIES
========================================== */

.stories{
    display:flex;

    overflow-x:auto;

    padding:10px;

    gap:10px;
}

.story{
    min-width:90px;

    background:white;

    border-radius:15px;

    overflow:hidden;

    box-shadow:0 2px 5px rgba(0,0,0,0.08);
}

.story img{
    width:100%;
    height:110px;

    object-fit:cover;
}

.story p{
    padding:8px;

    text-align:center;

    font-size:13px;

    font-weight:bold;
}


/* ==========================================
   POSTS
========================================== */

.post{
    background:white;

    margin-top:10px;

    padding:12px;
}

.post-header{
    display:flex;

    align-items:center;

    margin-bottom:10px;
}

.post-header img{
    width:48px;
    height:48px;

    border-radius:50%;

    margin-right:10px;
}

.post-user{
    font-weight:bold;

    font-size:15px;
}

.post-time{
    font-size:12px;

    color:gray;

    margin-top:2px;
}

.post-text{
    margin-bottom:12px;

    line-height:1.5;

    color:#222;
}

.post-image{
    width:100%;

    border-radius:12px;

    max-height:500px;

    object-fit:cover;
}


/* ==========================================
   POST ACTIONS
========================================== */

.post-actions{
    display:flex;

    justify-content:space-around;

    margin-top:10px;

    padding-top:10px;

    border-top:1px solid #eee;
}

.post-actions div{
    color:#555;

    font-size:14px;
}


/* ==========================================
   FLOATING BUTTON
========================================== */

.new-post-btn{
    position:fixed;

    bottom:28px;

    left:50%;

    transform:translateX(-50%);

    width:62px;
    height:62px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #1877f2,
            #42a5ff
        );

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:28px;

    text-decoration:none;

    box-shadow:
        0 5px 15px
        rgba(24,119,242,0.4);

    z-index:2000;

    border:4px solid white;
}


/* ==========================================
   BOTTOM NAVIGATION
========================================== */

.bottom-nav{
    position:fixed;

    bottom:0;
    left:0;

    width:100%;

    background:white;

    display:flex;

    justify-content:space-evenly;

    align-items:center;

    padding:10px 0;

    border-top:1px solid #ddd;

    z-index:1000;
}

.nav-item{
    text-decoration:none;

    color:gray;

    display:flex;

    flex-direction:column;

    align-items:center;

    font-size:12px;
}

.nav-item i{
    font-size:22px;

    margin-bottom:4px;
}

.active{
    color:#1877f2;
}


/* ==========================================
   COMMENT BOTTOM SHEET
========================================== */

.comment-overlay{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.45);

    z-index:5000;
}

.comment-overlay.active{

    display:block;
}

.comment-sheet{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    width:100%;

    max-width:650px;

    margin:auto;

    height:min(75vh,650px);

    background:white;

    border-radius:
        22px 22px 0 0;

    display:flex;

    flex-direction:column;

    box-shadow:
        0 -5px 30px
        rgba(0,0,0,0.18);

    animation:
        commentSheetUp
        0.25s ease;
}


@keyframes commentSheetUp{

    from{

        transform:
            translateY(100%);

    }

    to{

        transform:
            translateY(0);

    }

}


/* ==========================================
   COMMENT HEADER
========================================== */

.comment-sheet-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:16px 18px;

    border-bottom:1px solid #eee;

    flex-shrink:0;
}

.comment-sheet-title{

    font-size:18px;

    font-weight:bold;
}

.comment-close{

    width:36px;
    height:36px;

    border:none;

    border-radius:50%;

    background:#f0f2f5;

    color:#444;

    font-size:17px;

    cursor:pointer;
}


/* ==========================================
   COMMENT LIST
========================================== */

.comment-sheet-list{

    flex:1;

    overflow-y:auto;

    padding:15px 16px;
}


/* ==========================================
   COMMENT ITEM
========================================== */

.comment-item{

    display:flex;

    gap:10px;

    margin-bottom:15px;
}

.comment-avatar{

    width:40px;
    height:40px;

    border-radius:50%;

    object-fit:cover;

    flex-shrink:0;
}

.comment-content{

    background:#f0f2f5;

    border-radius:16px;

    padding:9px 13px;

    max-width:
        calc(100% - 50px);
}

.comment-user{

    font-weight:bold;

    font-size:13px;

    color:#222;
}

.comment-text{

    margin-top:4px;

    font-size:14px;

    line-height:1.4;

    color:#333;

    word-break:break-word;
}


/* ==========================================
   NO COMMENTS
========================================== */

.no-comments{

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    color:#888;

    text-align:center;
}

.no-comments i{

    font-size:42px;

    margin-bottom:12px;

    color:#bbb;
}

.no-comments-title{

    font-weight:bold;

    color:#555;

    font-size:16px;
}

.no-comments-text{

    margin-top:5px;

    font-size:13px;
}


/* ==========================================
   COMMENT INPUT
========================================== */

.comment-input-area{

    padding:12px 14px;

    border-top:1px solid #eee;

    background:white;

    flex-shrink:0;
}

.comment-input-row{

    display:flex;

    align-items:center;

    gap:8px;
}

.comment-input{

    flex:1;

    min-width:0;

    border:none;

    outline:none;

    background:#f0f2f5;

    border-radius:22px;

    padding:12px 15px;

    font-size:14px;
}

.comment-submit{

    width:42px;
    height:42px;

    border:none;

    border-radius:50%;

    background:#1877f2;

    color:white;

    cursor:pointer;

    flex-shrink:0;
}

.comment-submit:active{

    transform:scale(0.94);
}

.comment-submit:disabled{

    opacity:0.6;
}


/* ==========================================
   SHARE BUTTON
========================================== */

.share-btn{

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    min-width:60px;

    padding:8px;

    border-radius:10px;

    transition:
        background 0.2s ease,
        transform 0.1s ease;
}

.share-btn:hover{

    background:#f0f2f5;

}

.share-btn:active{

    transform:scale(0.94);

}

.share-btn i{

    font-size:17px;

}

.share-count{

    font-size:14px;

    color:#555;

}

.share-btn.processing{

    opacity:0.6;

    pointer-events:none;

}


/* ==========================================
   MOBILE COMMENT SHEET
========================================== */

@media(max-width:600px){

    .comment-sheet{

        height:78vh;

        border-radius:
            20px 20px 0 0;

    }

}

</style>

</head>

<!-- ==========================================
     SUPABASE
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
    "https://jxpvkamxtedgzztozonl.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_DCI0qvAlYNBpWi8DZkZF2g_frSEW_OX";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==========================================
   CURRENT USER
========================================== */

let currentUser = null;

let currentProfile = null;


async function loadCurrentUser(){

    try{


        const {

            data:{
                user
            },

            error

        } =
        await supabaseClient
            .auth
            .getUser();


        if(
            error ||
            !user
        ){

            window.location.href =
                "/login";

            return;

        }


        currentUser =
            user;


        console.log(
            "Logged in Supabase user:",
            user
        );


        const {

            data:profile,
            error:profileError

        } =
        await supabaseClient

            .from("profiles")

            .select(
                "id, username, name, mobile, bio, profile_url, cover_url"
            )

            .eq(
                "id",
                user.id
            )

            .single();


        if(profileError){

            console.error(
                "Profile loading error:",
                profileError
            );

            return;

        }


        currentProfile =
            profile;


        console.log(
            "Current Pathukkalam profile:",
            profile
        );


        const profileImages =
            document.querySelectorAll(
                ".current-user-profile"
            );


        profileImages.forEach(
            function(img){

                if(
                    profile.profile_url
                ){

                    img.src =
                        profile.profile_url;

                }

            }
        );


        const currentUserNames =
            document.querySelectorAll(
                ".current-user-name"
            );


        currentUserNames.forEach(
            function(element){

                element.innerText =
                    profile.name ||
                    profile.username;

            }
        );


        const currentUserLinks =
            document.querySelectorAll(
                ".current-user-profile-link"
            );


        currentUserLinks.forEach(
            function(link){

                link.href =
                    "/profile/" +
                    encodeURIComponent(
                        profile.username
                    );

            }
        );


    }
    catch(error){

        console.error(
            "User loading error:",
            error
        );

    }

}


/* ==========================================
   LOAD LIKE COUNTS
========================================== */

async function loadLikes(){

    const likeButtons =
        document.querySelectorAll(
            ".like-btn"
        );


    if(
        !likeButtons.length ||
        !currentUser
    ){

        return;

    }


    for(
        const button
        of likeButtons
    ){

        const postId =
            button.dataset.postId;


        const {

            count,
            error:countError

        } =
        await supabaseClient

            .from("likes")

            .select(
                "*",
                {
                    count:"exact",
                    head:true
                }
            )

            .eq(
                "post_id",
                postId
            );


        if(countError){

            console.error(
                "Like count error:",
                countError
            );

            continue;

        }


        const countElement =
            button.querySelector(
                ".like-count"
            );


        if(countElement){

            countElement.innerText =
                count || 0;

        }


        const {

            data:myLike,
            error:myLikeError

        } =
        await supabaseClient

            .from("likes")

            .select("id")

            .eq(
                "post_id",
                postId
            )

            .eq(
                "user_id",
                currentUser.id
            )

            .maybeSingle();


        if(myLikeError){

            console.error(
                "My like check error:",
                myLikeError
            );

            continue;

        }


        const icon =
            button.querySelector("i");


        if(myLike){

            icon.className =
                "fas fa-thumbs-up";

            button.style.color =
                "#1877f2";

        }
        else{

            icon.className =
                "far fa-thumbs-up";

            button.style.color =
                "#555";

        }

    }

}


/* ==========================================
   LIKE / UNLIKE
========================================== */

document.addEventListener(
    "click",
    async function(event){

        const button =
            event.target.closest(
                ".like-btn"
            );


        if(!button){

            return;

        }


        if(!currentUser){

            alert(
                "Please login to like this post."
            );

            return;

        }


        const postId =
            button.dataset.postId;


        if(
            button.dataset.processing ===
            "true"
        ){

            return;

        }


        button.dataset.processing =
            "true";


        try{


            const {

                data:existingLike,
                error:checkError

            } =
            await supabaseClient

                .from("likes")

                .select("id")

                .eq(
                    "post_id",
                    postId
                )

                .eq(
                    "user_id",
                    currentUser.id
                )

                .maybeSingle();


            if(checkError){

                throw checkError;

            }


            if(existingLike){

                const {
                    error
                } =
                await supabaseClient

                    .from("likes")

                    .delete()

                    .eq(
                        "id",
                        existingLike.id
                    );


                if(error){

                    throw error;

                }

            }

            else{

                const {
                    error
                } =
                await supabaseClient

                    .from("likes")

                    .insert({

                        post_id:
                            Number(postId),

                        user_id:
                            currentUser.id

                    });


                if(error){

                    throw error;

                }

            }


            await loadLikes();

        }
        catch(error){

            console.error(
                "Like error:",
                error
            );


            alert(
                "Unable to update Like: " +
                error.message
            );

        }
        finally{

            button.dataset.processing =
                "false";

        }

    }
);


/* ==========================================
   COMMENTS
========================================== */

let activeCommentPostId =
    null;


/* ==========================================
   LOAD COMMENTS
========================================== */

async function loadComments(
    postId
){

    const list =
        document.getElementById(
            "commentSheetList"
        );


    list.innerHTML = `

        <div class="no-comments">

            <i class="far fa-comment"></i>

            <div class="no-comments-title">
                Loading comments...
            </div>

        </div>

    `;


    const {

        data,
        error

    } =
    await supabaseClient

        .from("comments")

        .select(`
            id,
            comment,
            created_at,
            user_id
        `)

        .eq(
            "post_id",
            postId
        )

        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "Comments loading error:",
            error
        );


        list.innerHTML = `

            <div class="no-comments">

                <i class="fas fa-circle-exclamation"></i>

                <div class="no-comments-title">
                    Unable to load comments
                </div>

            </div>

        `;

        return;

    }


    document.getElementById(
        "sheetCommentCount"
    ).innerText =
        data.length;


    if(
        !data.length
    ){

        list.innerHTML = `

            <div class="no-comments">

                <i class="far fa-comment-dots"></i>

                <div class="no-comments-title">
                    No comments yet
                </div>

                <div class="no-comments-text">
                    Be the first to comment
                </div>

            </div>

        `;

        return;

    }


    const userIds =
        data.map(
            comment =>
                comment.user_id
        );


    const {

        data:profiles,
        error:profileError

    } =
    await supabaseClient

        .from("profiles")

        .select(
            "id, username, name, profile_url"
        )

        .in(
            "id",
            userIds
        );


    if(profileError){

        console.error(
            "Comment profile error:",
            profileError
        );

    }


    list.innerHTML = "";


    data.forEach(
        function(comment){

            const profile =
                profiles?.find(
                    p =>
                        p.id ===
                        comment.user_id
                );


            const name =
                profile?.name ||
                profile?.username ||
                "User";


            const avatar =
                profile?.profile_url ||
                "https://i.pravatar.cc/100";


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "comment-item";


            item.innerHTML = `

                <img
                    class="comment-avatar"
                    src="${escapeHtml(avatar)}"
                    alt="Profile">


                <div class="comment-content">

                    <div class="comment-user">

                        ${escapeHtml(name)}

                    </div>


                    <div class="comment-text">

                        ${escapeHtml(
                            comment.comment
                        )}

                    </div>

                </div>

            `;


            list.appendChild(
                item
            );

        }
    );

}

async function loadCommentCounts(){

    const buttons =
        document.querySelectorAll(
            ".comment-btn"
        );


    for(
        const button
        of buttons
    ){

        const postId =
            button.dataset.postId;


        const {

            count,
            error

        } =
        await supabaseClient

            .from("comments")

            .select(
                "*",
                {
                    count:"exact",
                    head:true
                }
            )

            .eq(
                "post_id",
                postId
            );


        if(error){

            console.error(
                "Comment count error:",
                error
            );

            continue;

        }


        const countElement =
            button.querySelector(
                ".comment-count"
            );


        if(countElement){

            countElement.innerText =
                count || 0;

        }

    }

}


/* ==========================================
   OPEN COMMENT SHEET
========================================== */

document.addEventListener(
    "click",
    async function(event){

        const button =
            event.target.closest(
                ".comment-btn"
            );

========================================== */

function closeCommentSheet(){

    const overlay =
        document.getElementById(
            "commentOverlay"
        );


    overlay.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";


    activeCommentPostId =

}

).addEventListener(

);

/* ==========================================
   SUBMIT COMMENT
========================================== */

async function submitComment(){

    if(!currentUser){

        alert(
            "Please login to comment."
        );

        return;

    }


    if(!activeCommentPostId){

        return;

    }


    const input =
        document.getElementById(
            "commentInput"
        );


    const button =
        document.getElementById(
            "commentSubmit"
        );


    const commentText =
        input.value.trim();


    if(!commentText){

        return;

    }


    button.disabled =
        true;


    try{

        const {

            data,
            error

        } =
        await supabaseClient

            .from("comments")

            .insert({

                post_id:
                    Number(
                        activeCommentPostId
                    ),

                user_id:
                    currentUser.id,

                comment:
                    commentText

            })

            .select()

            .single();


        if(error){

            throw error;

        }


        console.log(
            "Comment created:",
            data
        );


        input.value = "";


        await loadComments(
            activeCommentPostId
        );


        await loadCommentCounts();

    }
    catch(error){

        console.error(
            "Comment error:",
            error
        );


        alert(
            "Unable to add comment: " +
            error.message
        );

    }
    finally{

        button.disabled =
            false;

    }

}


document.getElementById(
    "commentSubmit"
).addEventListener(
    "click",
    submitComment
);


/* ==========================================
   ENTER TO SEND COMMENT
========================================== */

document.getElementById(
    "commentInput"
).addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            submitComment();

        }

    }
);

/* ==========================================
   SHARE POST
========================================== */

document.addEventListener(
    "click",
    async function(event){

        const button =
            event.target.closest(
                ".share-btn"
            );


        if(!button){

            return;

        }


        if(
            !currentUser
        ){

            alert(
                "Please login to share this post."
            );

            return;

        }


        if(
            button.classList.contains(
                "processing"
            )
        ){

            return;

        }


        button.classList.add(
            "processing"
        );


        const postId =
            button.dataset.postId;


        /*
        IMPORTANT:
        Always use the real Pathukkalam
        domain for shared links.
        */

        const shareUrl =
            "https://pathukkalam.in/post/" +
            postId;


        const shareTitle =
            "Pathukkalam";


        const shareText =
            "Check out this post on Pathukkalam 🚀";


        try{


            /*
            ======================================
            STEP 1
            SHARE THE POST
            ======================================
            */

            let shareCompleted =
                false;


            /*
            Mobile / supported browsers
            */

            if(
                navigator.share
            ){

                try{

                    await navigator.share({

                        title:
                            shareTitle,

                        text:
                            shareText,

                        url:
                            shareUrl

                    });


                    shareCompleted =
                        true;

                }
                catch(error){

                    /*
                    User cancelled share.
                    Do NOT count it.
                    */

                    if(
                        error.name ===
                        "AbortError"
                    ){

                        button.classList.remove(
                            "processing"
                        );

                        return;

                    }

                    /*
                    If native sharing fails,
                    continue to clipboard fallback.
                    */

                    console.warn(
                        "Native share failed:",
                        error
                    );

                }

            }


            /*
            ======================================
            DESKTOP / FALLBACK
            ======================================
            */

            if(
                !shareCompleted
            ){

                try{

                    await navigator
                        .clipboard
                        .writeText(
                            shareUrl
                        );


                    shareCompleted =
                        true;


                    alert(
                        "Post link copied! 🔗"
                    );

                }
                catch(error){

                    console.error(
                        "Clipboard error:",
                        error
                    );


                    alert(
                        "Unable to share this post."
                    );


                    button.classList.remove(
                        "processing"
                    );

                    return;

                }

            }


            /*
            ======================================
            STEP 2
            RECORD REAL SHARE
            ======================================
            */

            if(
                shareCompleted
            ){

                const {

                    data,
                    error

                } =
                await supabaseClient

                    .from("shares")

                    .insert({

                        post_id:
                            Number(
                                postId
                            ),

                        user_id:
                            currentUser.id

                    })

                    .select()
                    .single();


                if(error){

                    console.error(
                        "Share database error:",
                        error
                    );


                    /*
                    The actual share already
                    happened, so don't tell
                    user that sharing failed.
                    */

                }
                else{

                    console.log(
                        "Share recorded:",
                        data
                    );

                }


                /*
                ==================================
                STEP 3
                REFRESH SHARE COUNT
                ==================================
                */

                await loadShareCounts();

            }

        }
        catch(error){

            console.error(
                "Share error:",
                error
            );

        }
        finally{

            button.classList.remove(
                "processing"
            );

        }

    }
);


/* ==========================================
   HTML SAFETY
========================================== */

function escapeHtml(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value;


    return div.innerHTML;

}
