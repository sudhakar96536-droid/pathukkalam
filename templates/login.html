{% extends "base.html" %}


{% block title %}
Login - Pathukkalam
{% endblock %}


{% block head %}

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo img{
    width:75px;
    height:75px;
    border-radius:18px;
}

.logo h1{
    color:#1877f2;
    margin:10px 0 5px;
}

.logo p{
    color:gray;
}

.input-box{
    margin-top:18px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:bold;
    color:#444;
}

.input-box input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.input-box input:focus{
    border-color:#1877f2;
}

.login-btn{
    width:100%;
    padding:15px;
    margin-top:22px;
    border:none;
    border-radius:14px;
    background:#1877f2;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#1669d8;
}

.login-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.forgot-link{
    display:block;
    text-align:right;
    margin-top:10px;
    color:#1877f2;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
}

.google-btn{
    width:100%;
    padding:15px;
    margin-top:18px;
    border:1px solid #ddd;
    border-radius:14px;
    background:#fff;
    color:#333;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
.google-btn:hover{background:#f7f7f7;}
.google-btn:disabled{opacity:.6;cursor:not-allowed;}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:18px;
    color:#999;
    font-size:13px;
}
.divider:before,.divider:after{
    content:"";
    flex:1;
    height:1px;
    background:#ddd;
}

.message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.bottom-text{
    text-align:center;
    margin-top:20px;
    color:#555;
    font-size:14px;
}

.bottom-text a{
    color:#1877f2;
    text-decoration:none;
    font-weight:bold;
}

</style>

{% endblock %}


{% block content %}


<div class="login-box">

    <div class="logo">

        <img
            src="{{ url_for('static', filename='icon-192.png') }}">

        <h1>
            Pathukkalam
        </h1>

        <p>
            Welcome back 🚀
        </p>

    </div>


    <form id="loginForm">

        <div class="input-box">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="@username"
                autocomplete="username"
                required>

        </div>


        <div class="input-box">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required>

        </div>


        <a href="/forgot-password" class="forgot-link">
            Forgot Password?
        </a>

        <button
            type="submit"
            class="login-btn"
            id="loginBtn">

            Login

        </button>


        <div
            id="loginMessage"
            class="message">
        </div>

    </form>


    <div class="divider">OR</div>

    <button type="button" class="google-btn" id="googleBtn">
        <i class="fab fa-google"></i> Continue with Google
    </button>

    <div class="bottom-text">

        Don't have an account?

        <a href="/register">
            Create Account
        </a>

    </div>

</div>


{% endblock %}


{% block scripts %}


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://jxpvkamxtedgzztozonl.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_DCI0qvAlYNBpWi8DZkZF2g_frSEW_OX";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );


console.log(
    "Supabase client ready"
);


/* =========================================================
   GET REDIRECT DESTINATION
========================================================= */

function getNextPage(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    let next =
        params.get("next");


    /*
     * Default behaviour remains Home.
     *
     * So normal login without ?next=
     * still goes to "/".
     */

    if(!next){

        return "/";

    }


    /*
     * Security:
     *
     * Only allow internal Pathukkalam
     * paths.
     *
     * Prevent external redirect such as:
     * https://example.com
     */

    if(
        !next.startsWith("/") ||
        next.startsWith("//")
    ){

        return "/";

    }


    return next;

}


/* =========================================================
   LOGIN
========================================================= */

document.getElementById(
    "loginForm"
).addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const username =
            document.getElementById(
                "username"
            )
            .value
            .trim()
            .replace("@","")
            .toLowerCase();


        const password =
            document.getElementById(
                "password"
            )
            .value;


        const button =
            document.getElementById(
                "loginBtn"
            );


        const message =
            document.getElementById(
                "loginMessage"
            );


        button.disabled =
            true;


        button.innerText =
            "Logging in...";


        message.innerText =
            "";


        try{

            /* =================================================
               FIND EMAIL FROM USERNAME
            ================================================= */

            const response =
                await fetch(
                    `/api/user-email/${encodeURIComponent(
                        username
                    )}`
                );


            const result =
                await response.json();


            if(!response.ok){

                throw new Error(
                    result.error ||
                    "Username not found"
                );

            }


            /* =================================================
               SUPABASE LOGIN
            ================================================= */

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email:
                        result.email,

                    password:
                        password

                });


            if(error){

                throw error;

            }


            console.log(
                "Logged in user:",
                data.user
            );


            console.log(
                "Session:",
                data.session
            );


            /* =================================================
               VERIFY SESSION WAS CREATED
            ================================================= */

            const {
                data:sessionData,
                error:sessionError
            } =
            await supabaseClient
                .auth
                .getSession();


            if(sessionError){

                throw sessionError;

            }


            if(
                !sessionData ||
                !sessionData.session
            ){

                throw new Error(
                    "Login completed, but session could not be created. Please try again."
                );

            }


            console.log(
                "Supabase session confirmed."
            );


            /* =================================================
               SUCCESS MESSAGE
            ================================================= */

            message.style.color =
                "green";


            message.innerText =
                "Login successful!";


            /* =================================================
               DETERMINE WHERE TO GO
            ================================================= */

            const nextPage =
                getNextPage();


            console.log(
                "Redirecting to:",
                nextPage
            );


            /* =================================================
               REDIRECT
            ================================================= */

            setTimeout(
                function(){

                    window.location.replace(
                        nextPage
                    );

                },
                500
            );

        }
        catch(error){

            console.error(
                "Login error:",
                error
            );


            message.style.color =
                "red";


            message.innerText =
                error.message ||
                "Login failed.";

        }
        finally{

            /*
             * If redirect is about to happen,
             * this doesn't cause any problem.
             */

            button.disabled =
                false;


            button.innerText =
                "Login";

        }

    }
);

\n\n/* =========================================================\n   GOOGLE LOGIN\n========================================================= */\n\nasync function ensureGoogleProfile(user){\n\n    if(!user || !user.id){ return; }\n\n    const metadata = user.user_metadata || {};\n\n    const { data: existing, error: existingError } =\n        await supabaseClient\n            .from("profiles")\n            .select("id,username")\n            .eq("id", user.id)\n            .maybeSingle();\n\n    if(existing){ return; }\n    if(existingError){\n        console.warn("Profile lookup warning:", existingError.message);\n    }\n\n    const fullName =\n        metadata.full_name ||\n        metadata.name ||\n        (user.email || "Pathukkalam User").split("@")[0];\n\n    const base = ((user.email || "user").split("@")[0])\n        .toLowerCase()\n        .replace(/[^a-z0-9_]/g, "")\n        .slice(0,20) || "user";\n\n    let username = base;\n\n    for(let i=0;i<100;i++){\n        const candidate = i === 0 ? base : base + i;\n        const { data: taken } = await supabaseClient\n            .from("profiles")\n            .select("id")\n            .eq("username", candidate)\n            .maybeSingle();\n        if(!taken){ username=candidate; break; }\n    }\n\n    const { error } = await supabaseClient\n        .from("profiles")\n        .insert({\n            id:user.id,\n            username:username,\n            name:fullName,\n            mobile:metadata.mobile || null,\n            bio:"",\n            profile_url:null,\n            cover_url:null\n        });\n\n    if(error){\n        console.warn("Google profile creation note:", error.message);\n    }\n}\n\nasync function handleOAuthReturn(){\n    const { data:{ session }, error } =\n        await supabaseClient.auth.getSession();\n\n    if(error || !session || !session.user){ return; }\n\n    const isOAuthReturn =\n        window.location.hash.includes("access_token") ||\n        window.location.hash.includes("refresh_token") ||\n        new URLSearchParams(window.location.search).has("code");\n\n    if(!isOAuthReturn){ return; }\n\n    try{ await ensureGoogleProfile(session.user); }\n    catch(e){ console.warn("Google profile setup:",e); }\n\n    window.history.replaceState({}, document.title, window.location.pathname);\n    window.location.replace(getNextPage());\n}\n\nhandleOAuthReturn();\n\ndocument.getElementById("googleBtn").addEventListener("click", async function(){\n    const button=this;\n    const message=document.getElementById("loginMessage");\n    button.disabled=true;\n    button.innerHTML='<i class="fab fa-google"></i> Connecting...';\n    message.innerText="";\n\n    try{\n        const next=encodeURIComponent(getNextPage());\n        const redirectTo=window.location.origin + "/login?next=" + next;\n        const { error } = await supabaseClient.auth.signInWithOAuth({\n            provider:"google",\n            options:{ redirectTo:redirectTo }\n        });\n        if(error){ throw error; }\n    }catch(error){\n        console.error("Google login error:",error);\n        message.style.color="red";\n        message.innerText=error.message || "Google login failed.";\n        button.disabled=false;\n        button.innerHTML='<i class="fab fa-google"></i> Continue with Google';\n    }\n});\n</script>


{% endblock %}
