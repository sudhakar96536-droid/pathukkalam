{% extends "base.html" %}


{% block title %}
Login - Pathukkalam
{% endblock %}


{% block head %}

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo img{
    width:75px;
    height:75px;
    border-radius:18px;
}

.logo h1{
    color:#1877f2;
    margin:10px 0 5px;
}

.logo p{
    color:gray;
}

.input-box{
    margin-top:18px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:bold;
    color:#444;
}

.input-box input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.input-box input:focus{
    border-color:#1877f2;
}

.login-btn{
    width:100%;
    padding:15px;
    margin-top:22px;
    border:none;
    border-radius:14px;
    background:#1877f2;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#1669d8;
}

.login-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.bottom-text{
    text-align:center;
    margin-top:20px;
    color:#555;
    font-size:14px;
}

.bottom-text a{
    color:#1877f2;
    text-decoration:none;
    font-weight:bold;
}

</style>

{% endblock %}


{% block content %}


<div class="login-box">

    <div class="logo">

        <img
            src="{{ url_for('static', filename='icon-192.png') }}">

        <h1>
            Pathukkalam
        </h1>

        <p>
            Welcome back 🚀
        </p>

    </div>


    <form id="loginForm">

        <div class="input-box">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="@username"
                autocomplete="username"
                required>

        </div>


        <div class="input-box">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required>

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn">

            Login

        </button>


        <div
            id="loginMessage"
            class="message">
        </div>

    </form>


    <div class="bottom-text">

        Don't have an account?

        <a href="/register">
            Create Account
        </a>

    </div>

</div>


{% endblock %}


{% block scripts %}


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://jxpvkamxtedgzztozonl.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_DCI0qvAlYNBpWi8DZkZF2g_frSEW_OX";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


console.log(
    "Supabase client ready"
);


/* ==========================================
   LOGIN
========================================== */

document.getElementById("loginForm").addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const username =
            document.getElementById("username")
            .value
            .trim()
            .replace("@","")
            .toLowerCase();


        const password =
            document.getElementById("password")
            .value;


        const button =
            document.getElementById("loginBtn");


        const message =
            document.getElementById("loginMessage");


        button.disabled = true;

        button.innerText =
            "Logging in...";

        message.innerText = "";


        try{

            /*
            ======================================
            Find the email associated
            with the username.
            ======================================
            */

            const response =
                await fetch(
                    `/api/user-email/${encodeURIComponent(username)}`
                );


            const result =
                await response.json();


            if(!response.ok){

                throw new Error(
                    result.error ||
                    "Username not found"
                );

            }


            /*
            ======================================
            Login using Supabase Auth
            ======================================
            */

            const {
                data,
                error
            } =
            await supabaseClient.auth.signInWithPassword({

                email:
                    result.email,

                password:
                    password

            });


            if(error){

                throw error;

            }


            console.log(
                "Logged in user:",
                data.user
            );


            console.log(
                "Session:",
                data.session
            );


            message.style.color =
                "green";


            message.innerText =
                "Login successful!";


            setTimeout(function(){

                window.location.href =
                    "/";

            }, 500);


        }
        catch(error){

            message.style.color =
                "red";


            message.innerText =
                error.message;

        }


        button.disabled =
            false;


        button.innerText =
            "Login";

    }

);

</script>


{% endblock %}
