<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Pathukkalam Marketplace</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f0f2f5;
    padding-bottom:120px;
    color:#222;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    background:#1877f2;
    color:white;
    padding:17px;
    font-size:22px;
    font-weight:bold;
    position:sticky;
    top:0;
    z-index:1000;
    text-align:center;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{
    background:white;
    padding:12px;
    position:sticky;
    top:58px;
    z-index:999;
    border-bottom:1px solid #eee;
}

.search-wrapper{
    display:flex;
    align-items:center;
    gap:8px;
    background:#f0f2f5;
    border-radius:14px;
    padding:0 13px;
}

.search-wrapper i{
    color:#777;
}

.search-box input{
    width:100%;
    padding:13px 5px;
    border:none;
    background:transparent;
    outline:none;
    font-size:15px;
}


/* =========================================================
   TOP BUTTONS
========================================================= */

.top-action{
    padding:0 12px;
    display:flex;
    gap:8px;
    margin-top:12px;
}

.top-btn{
    flex:1;
    padding:14px 7px;
    border:none;
    background:#1877f2;
    color:white;
    border-radius:15px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.top-btn.active{
    background:#ffb400;
    color:#222;
    transform:scale(1.02);
}

.top-btn:active{
    transform:scale(.98);
}


/* =========================================================
   SELL FORM
========================================================= */

.sell-form{
    background:white;
    margin:14px 12px;
    padding:18px;
    border-radius:18px;
    display:none;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.form-title{
    font-size:21px;
    font-weight:bold;
    color:#1877f2;
    margin-bottom:17px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:13px;
    border:none;
    background:#f0f2f5;
    border-radius:12px;
    outline:none;
    font-size:14px;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    outline:2px solid rgba(24,119,242,.15);
}

textarea{
    resize:none;
    height:95px;
}

.image-preview{
    display:none;
    width:100%;
    max-height:240px;
    object-fit:cover;
    border-radius:12px;
    margin-top:10px;
}

.btn-group{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.post-btn,
.draft-btn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.post-btn{
    background:#1877f2;
    color:white;
}

.draft-btn{
    background:#ddd;
    color:#333;
}


/* =========================================================
   SECTION
========================================================= */

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:19px 14px 6px;
}

.section-title{
    font-size:19px;
    font-weight:bold;
    color:#1877f2;
}

.section-subtitle{
    margin:0 14px 12px;
    color:#888;
    font-size:13px;
}

.refresh-btn{
    width:38px;
    height:38px;
    border:none;
    background:white;
    color:#1877f2;
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,.08);
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.product{
    background:white;
    margin:12px;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product-image{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
    background:#eee;
}

.product-details{
    padding:15px;
}

.product-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
    word-break:break-word;
}

.condition{
    display:inline-block;
    padding:6px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:9px;
}

.condition-new{
    background:#e7f8ea;
    color:#008a28;
}

.condition-used{
    background:#fff4e5;
    color:#d66f00;
}

.condition-rebuild{
    background:#e8f1ff;
    color:#1877f2;
}


/* =========================================================
   SELLER
========================================================= */

.seller{
    display:flex;
    align-items:center;
    gap:10px;
    margin:7px 0 10px;
    padding:8px 0;
}

.seller-avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
}

.seller-info{
    min-width:0;
    flex:1;
}

.seller-name{
    font-size:14px;
    font-weight:bold;
}

.seller-username{
    font-size:11px;
    color:#888;
    margin-top:2px;
}

.profile-link{
    border:none;
    background:#e8f1ff;
    color:#1877f2;
    border-radius:10px;
    padding:7px 9px;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}


/* =========================================================
   PRICE
========================================================= */

.price-row{
    margin-top:7px;
}

.mrp{
    text-decoration:line-through;
    color:#999;
    margin-right:9px;
    font-size:14px;
}

.offer{
    color:#008a28;
    font-size:21px;
    font-weight:bold;
}


/* =========================================================
   LOCATION / DESCRIPTION
========================================================= */

.location{
    margin-top:10px;
    color:#666;
    font-size:13px;
}

.description{
    margin-top:10px;
    color:#555;
    font-size:13px;
    line-height:1.5;
    word-break:break-word;
}


/* =========================================================
   STATISTICS
========================================================= */

.product-stats{
    display:flex;
    gap:15px;
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #eee;
    color:#888;
    font-size:11px;
}

.product-stats span{
    display:flex;
    align-items:center;
    gap:4px;
}


/* =========================================================
   ACTION ROW
========================================================= */

.action-row{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:15px;
}

.view-btn,
.interested-btn{
    flex:1;
    padding:12px 7px;
    border:none;
    border-radius:11px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.view-btn{
    background:#1877f2;
    color:white;
}

.interested-btn{
    background:#00a86b;
    color:white;
}

.interested-btn.active{
    background:#007d51;
}

.icon-btn{
    width:43px;
    height:43px;
    border:none;
    border-radius:11px;
    font-size:17px;
    cursor:pointer;
    color:white;
    flex-shrink:0;
}

.like-btn{
    background:#ff4d6d;
}

.like-btn.liked{
    background:#00a86b;
}

.share-btn{
    background:#ffb400;
    color:#222;
}

.whatsapp-btn{
    background:#25d366;
}


/* =========================================================
   OWNER CONTROLS
========================================================= */

.owner-controls{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.owner-btn{
    flex:1;
    padding:10px 5px;
    border:none;
    border-radius:10px;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.hide-btn{
    background:#fff4d6;
    color:#9b6800;
}

.activate-btn{
    background:#dff7e9;
    color:#00834f;
}

.delete-btn{
    background:#ffe3e3;
    color:#c62828;
}

.status-badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:15px;
    font-size:10px;
    font-weight:bold;
    margin-bottom:8px;
}

.status-active{
    background:#dff7e9;
    color:#00834f;
}

.status-hidden{
    background:#eee;
    color:#777;
}


/* =========================================================
   MY / LIKED SECTIONS
========================================================= */

.special-section{
    display:none;
}

.special-section-title{
    font-size:19px;
    font-weight:bold;
    margin:20px 14px 4px;
    color:#1877f2;
}

.special-section-subtitle{
    margin:0 14px 12px;
    color:#888;
    font-size:13px;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    text-align:center;
    padding:50px 20px;
    color:#777;
}

.loading i{
    font-size:28px;
    margin-bottom:12px;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-state{
    text-align:center;
    padding:50px 20px;
    color:#888;
}

.empty-state i{
    font-size:42px;
    color:#bbb;
    margin-bottom:13px;
}

.empty-title{
    font-size:16px;
    font-weight:bold;
    color:#555;
}

.empty-text{
    font-size:13px;
    margin-top:6px;
    line-height:1.5;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:20000;
}

.modal{
    background:white;
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:20px;
    padding:20px;
}

.modal-close{
    float:right;
    border:none;
    background:#eee;
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
}

.modal-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:14px;
    padding-right:40px;
}

.modal-image{
    width:100%;
    max-height:300px;
    object-fit:cover;
    border-radius:14px;
    margin-bottom:14px;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:white;
    padding:12px 18px;
    border-radius:25px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:30000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:500px){

    .header{
        font-size:20px;
    }

    .product{
        margin:10px;
    }

    .top-action{
        padding:0 10px;
    }

    .top-btn{
        font-size:11px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<div class="header">

    🛒 Pathukkalam Marketplace

</div>


<!-- =======================================================
     SEARCH
======================================================= -->

<div class="search-box">

    <div class="search-wrapper">

        <i class="fas fa-search"></i>

        <input
            type="text"
            id="searchInput"
            placeholder="Search product, person, location..."
            autocomplete="off">

    </div>

</div>


<!-- =======================================================
     TOP BUTTONS
======================================================= -->

<div class="top-action">

    <button
        class="top-btn"
        id="sellBtn">

        <i class="fas fa-plus"></i>
        Sell Product

    </button>


    <button
        class="top-btn"
        id="listedBtn">

        <i class="fas fa-box"></i>
        My Listings

    </button>


    <button
        class="top-btn"
        id="likedBtn">

        <i class="fas fa-heart"></i>
        Liked

    </button>

</div>


<!-- =======================================================
     SELL FORM
======================================================= -->

<div
    class="sell-form"
    id="sellForm">

    <div class="form-title">

        <i class="fas fa-store"></i>
        Create Product Post

    </div>


    <div class="form-group">

        <label>Product Name *</label>

        <input
            type="text"
            id="productName"
            placeholder="iPhone 14">

    </div>


    <div class="form-group">

        <label>Product Condition *</label>

        <select id="productCondition">

            <option value="New">
                🟢 New
            </option>

            <option value="Used">
                🟠 Used
            </option>

            <option value="Rebuild">
                🔵 Rebuild
            </option>

        </select>

    </div>


    <div class="form-group">

        <label>MRP Price</label>

        <input
            type="number"

    <div class="form-group">

        <label>Offer Price *</label>

        <input
            type="number"
            id="offerPrice"
            placeholder="45000"
            min="0">

    </div>


    <div class="form-group">

        <label>Location *</label>

        <input
            type="text"
            id="productLocation"

    </div>


    <div class="form-group">

        <label>Description</label>

        <textarea

    </div>

        <input

</div>


<!-- =======================================================
     MY LISTINGS
======================================================= -->

<div
    class="special-section"
    id="listedProducts">

    <div class="special-section-title">

        📦 My Listed Products

    </div>

    <div class="special-section-subtitle">

        Manage your Marketplace products.
        Active products are visible to everyone.

    </div>


    <div id="listedProductsContainer">

    </div>

</div>


<!-- =======================================================
     LIKED PRODUCTS
======================================================= -->

<div
    class="special-section"
    id="likedProducts">

    <div class="special-section-title">

        ❤️ Products Liked By Me

    </div>

    <div class="special-section-subtitle">

        Products you have liked.

    </div>


    <div id="likedProductsContainer">

    </div>

</div>


<!-- =======================================================
     GLOBAL MARKETPLACE
======================================================= -->

<div id="globalSection">

    <div class="section-header">

        <div class="section-title">

            🌍 Marketplace

        </div>


        <button
            class="refresh-btn"
            id="refreshBtn"
            title="Refresh">

            <i class="fas fa-rotate"></i>

        </button>

    </div>


    <div class="section-subtitle">

        Latest products from Pathukkalam users

    </div>


    <div id="productsContainer">

    </div>

</div>


<!-- =======================================================
     PRODUCT VIEW MODAL
======================================================= -->

<div
    class="modal-overlay"
    id="productModal">

    <div class="modal">

        <button
            class="modal-close"
            id="closeModalBtn">

            <i class="fas fa-xmark"></i>

        </button>


        <div id="modalContent">

        </div>

    </div>

</div>


<!-- =======================================================
     TOAST
======================================================= -->

<div
    class="toast"
    id="toast">

</div>


<!-- =======================================================
     SUPABASE
======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://jxpvkamxtedgzztozonl.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_DCI0qvAlYNBpWi8DZkZF2g_frSEW_OX";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let currentProfile = null;

let allProducts = [];

let myLikedProductIds = new Set();

let searchText = "";


/* =========================================================
   ELEMENTS
========================================================= */

const productsContainer =
    document.getElementById(
        "productsContainer"
    );

const listedProductsContainer =
    document.getElementById(
        "listedProductsContainer"
    );

const likedProductsContainer =
    document.getElementById(
        "likedProductsContainer"
    );

const sellForm =
    document.getElementById(
        "sellForm"
    );

const listedProducts =
    document.getElementById(
        "listedProducts"
    );

const likedProducts =
    document.getElementById(
        "likedProducts"
    );

const globalSection =
    document.getElementById(
        "globalSection"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.innerText =
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(
        function(){

            toast.classList.remove(
                "show"
            );

        },
        3000
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


/* =========================================================
   REQUIRE LOGIN
========================================================= */

function requireLogin(){

    if(currentUser){

        return true;

    }


    showToast(
        "Please login to continue."
    );


    setTimeout(
        function(){

            window.location.href =
                "/login";

        },
        700
    );


    return false;

}


/* =========================================================
   CURRENT USER
========================================================= */

async function loadCurrentUser(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();


        if(
            !error &&
            data &&
            data.user
        ){

            currentUser =
                data.user;


            const {
                data:profile,
                error:profileError
            } =
            await supabaseClient
                .from("profiles")
                .select(`
                    id,
                    username,
                    name,
                    profile_url
                `)
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();


            if(!profileError){

                currentProfile =
                    profile || null;

            }


            return true;

        }

    }
    catch(error){

        console.error(
            "Current user error:",
            error
        );

    }


    currentUser =
        null;

    currentProfile =
        null;

    return false;

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadGlobalProducts(){

    productsContainer.innerHTML = `

        <div class="loading">

            <i class="fas fa-spinner fa-spin"></i>

            <div>
                Loading Marketplace...
            </div>

        </div>

    `;


    const {
        data:products,
        error
    } =
    await supabaseClient
        .from(
            "marketplace_products"
        )
        .select(`
            id,
            user_id,
            product_name,
            condition,
            mrp_price,
            offer_price,
            location,
            description,
            image_url,
            status,
            views_count,
            likes_count,
            interests_count,
            shares_count,
            whatsapp_clicks_count,
            created_at,
            updated_at
        `)
        .eq(
            "status",
            "active"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Marketplace loading error:",
            error
        );


        productsContainer.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-circle-exclamation"></i>

                <div class="empty-title">
                    Unable to load Marketplace
                </div>

                <div class="empty-text">
                    ${escapeHtml(error.message)}
                </div>

            </div>

        `;

        return;

    }


    allProducts =
        products || [];


    await attachProfiles(
        allProducts
    );


    await loadMyLikes();

    renderGlobalProducts();

}


/* =========================================================
   ATTACH PROFILES
========================================================= */

async function attachProfiles(
    products
){

    const userIds =
        [
            ...new Set(
                products
                    .map(
                        product =>
                            product.user_id
                    )
                    .filter(Boolean)
            )
        ];


    if(!userIds.length){

        return;

    }


    const {
        data:profiles,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            name,
            profile_url
        `)
        .in(
            "id",
            userIds
        );


    if(error){

        console.error(
            "Profile loading error:",
            error
        );

        return;

    }


    const profileMap =
        new Map();


    (
        profiles || []
    ).forEach(
        profile => {

            profileMap.set(
                profile.id,
                profile
            );

        }
    );


    products.forEach(
        product => {

            product.profile =
                profileMap.get(
                    product.user_id
                ) || null;

        }
    );

}


/* =========================================================
   LOAD MY LIKES
========================================================= */

async function loadMyLikes(){

    myLikedProductIds =
        new Set();


    if(!currentUser){

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from(
            "marketplace_likes"
        )
        .select(
            "product_id"
        )
        .eq(
            "user_id",
            currentUser.id
        );


    if(error){

        console.error(
            "Likes loading error:",
            error
        );

        return;

    }


    (
        data || []
    ).forEach(
        item => {

            myLikedProductIds.add(
                Number(
                    item.product_id
                )
            );

        }

/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function(){

        searchText =
            this.value
                .trim()
                .toLowerCase();


        renderGlobalProducts();

        if(
            listedProducts.style.display ===
            "block"
        ){

            renderMyListings();

        }


        if(
            likedProducts.style.display ===
            "block"
        ){

            renderLikedProducts();

        }

    }
);


/* =========================================================
   SEARCH FILTER
========================================================= */

function matchesSearch(
    product
){

    if(!searchText){

        return true;

    }


    const profile =
        product.profile || {};


    const searchableText =
        [

            product.product_name,

            product.condition,

            product.location,

            product.description,

            profile.name,

            profile.username

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


    return searchableText.includes(
        searchText
    );

}


/* =========================================================
   FILTER GLOBAL
========================================================= */

function getFilteredGlobalProducts(){

    return allProducts.filter(
        product =>
            matchesSearch(product)
    );

}


/* =========================================================
   RENDER GLOBAL
========================================================= */

function renderGlobalProducts(){

    const products =
        getFilteredGlobalProducts();


    productsContainer.innerHTML =
        "";


    if(!products.length){

        productsContainer.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-box-open"></i>

                <div class="empty-title">

                    ${
                        searchText
                            ? "No products found"
                            : "No active products yet"
                    }

                </div>

                <div class="empty-text">

                    ${
                        searchText
                            ? "Try another product, person, location or keyword."
                            : "Be the first person to list a product."
                    }

                </div>

            </div>

        `;

        return;

    }


    products.forEach(
        product => {

            productsContainer.appendChild(
                createProductCard(
                    product,
                    false
                )
            );

        }
    );

}


/* =========================================================
   CONDITION CLASS
========================================================= */

function getConditionClass(
    condition
){

    if(condition === "New"){

        return "condition-new";

    }

    if(condition === "Rebuild"){

        return "condition-rebuild";

    }

    return "condition-used";

}

/* =========================================================
   NUMBER FORMAT
========================================================= */

function formatNumber(
    value
){

    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return "0";

    }


    return number.toLocaleString(
        "en-IN"
    );

}


/* =========================================================
   LIKE / UNLIKE
========================================================= */

async function toggleLike(
    product,
    button
){

    if(!requireLogin()){

        return;

    }


    button.disabled =
        true;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .rpc(
                "marketplace_toggle_like",
                {
                    p_product_id:
                        Number(
                            product.id
                        )
                }
            );


        if(error){

            throw error;

        }


        const liked =
            data === true;


        if(liked){

            myLikedProductIds.add(
                Number(
                    product.id
                )
            );


            showToast(
                "Product liked ❤️"
            );


            await createMarketplaceNotification({

                receiverId:
                    product.user_id,

                type:
                    "marketplace_like",

                message:
                    (
                        currentProfile?.name ||
                        currentProfile?.username ||
                        "Someone"
                    ) +
                    " liked your product \"" +
                    product.product_name +
                    "\"."

            });

        }
        else{

            myLikedProductIds.delete(
                Number(
                    product.id
                )
            );


            showToast(
                "Removed from liked products."
            );

        }


        await loadGlobalProducts();

    }
    catch(error){

        console.error(
            "Like error:",
            error
        );


        showToast(
            "Unable to update like: " +
            error.message
        );

    }
    finally{

        button.disabled =
            false;

    }

}


/* =========================================================
   INTEREST
========================================================= */

async function addInterest(
    product,
    button
){

    if(!requireLogin()){

        return;

    }


    button.disabled =
        true;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .rpc(
                "marketplace_add_interest",
                {
                    p_product_id:
                        Number(
                            product.id
                        )
                }
            );


        if(error){

            throw error;

        }


        if(data === true){

            product._interested =
                true;


            button.classList.add(
                "active"
            );


            button.innerText =
                "✓ Interested";


            await createMarketplaceNotification({

                receiverId:
                    product.user_id,

                type:
                    "marketplace_interest",

                message:
                    (
                        currentProfile?.name ||
                        currentProfile?.username ||
                        "Someone"
                    ) +
                    " is interested in your product \"" +
                    product.product_name +
                    "\"."

            });


            showToast(
                "Interest sent successfully! ✓"
            );

        }
        else{

            showToast(
                "You already showed interest."
            );

        }

    }
    catch(error){

        console.error(
            "Interest error:",
            error
        );


        showToast(
            "Unable to send interest: " +
            error.message
        );

    }
    finally{

        button.disabled =
            false;

    }

}


/* =========================================================
   SHARE PRODUCT
========================================================= */

async function shareProduct(
    product
){

    if(!requireLogin()){

        return;

    }


    const shareUrl =
        window.location.origin +
        "/marketplace";


    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    product.product_name,

                text:
                    "Check this product on Pathukkalam Marketplace",

                url:
                    shareUrl

            });

        }
        else{

            await navigator.clipboard.writeText(
                shareUrl
            );


            showToast(
                "Marketplace link copied."
            );

        }


        await supabaseClient
            .rpc(
                "marketplace_record_share",
                {
                    p_product_id:
                        Number(
                            product.id
                        )
                }
            );


        await createMarketplaceNotification({

            receiverId:
                product.user_id,

            type:
                "marketplace_share",

            message:
                (
                    currentProfile?.name ||
                    currentProfile?.username ||
                    "Someone"
                ) +
                " shared your product \"" +
                product.product_name +
                "\"."

        });


        showToast(
            "Product shared ✓"
        );

    }
    catch(error){

        /*
           User cancelling native share
           should not show an error.
        */

        if(
            error.name ===
            "AbortError"
        ){

            return;

        }


        console.error(
            "Share error:",
            error
        );

    }

}


/* =========================================================
   WHATSAPP
========================================================= */

async function openWhatsApp(
    product
){

    if(!requireLogin()){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .rpc(
                "marketplace_record_whatsapp",
                {
                    p_product_id:
                        Number(
                            product.id
                        )
                }
            );


        if(error){

            console.error(
                "WhatsApp tracking error:",
                error
            );

        }


        await createMarketplaceNotification({

            receiverId:
                product.user_id,

            type:
                "marketplace_whatsapp",

            message:
                (
                    currentProfile?.name ||
                    currentProfile?.username ||
                    "Someone"
                ) +
                " clicked WhatsApp for your product \"" +
                product.product_name +
                "\"."

        });


        /*
           We do not have a phone-number field
           specifically for Marketplace.

           So open WhatsApp with a product
           enquiry message. The seller can continue
           the conversation after choosing a number
           through their normal WhatsApp flow.

           If your profiles.mobile contains a
           WhatsApp number, we use it.
        */

        const mobile =
            product.profile?.mobile ||
            "";


        const text =
            "Hi, I am interested in your Pathukkalam Marketplace product: " +
            product.product_name;


        let whatsappUrl;


        if(mobile){

            const cleanNumber =
                String(mobile)
                    .replace(
                        /[^0-9]/g,
                        ""
                    );


            whatsappUrl =
                "https://wa.me/" +
                cleanNumber +
                "?text=" +
                encodeURIComponent(
                    text
                );

        }
        else{

            whatsappUrl =
                "https://wa.me/?text=" +
                encodeURIComponent(
                    text
                );

        }


        window.open(
            whatsappUrl,
            "_blank"
        );

    }
    catch(error){

        console.error(
            "WhatsApp error:",
            error
        );


        showToast(
            "Unable to open WhatsApp."
        );

    }

}

/* =========================================================
   UPDATE PRODUCT STATUS
========================================================= */

async function updateProductStatus(
    product,
    newStatus
){

    if(!requireLogin()){

        return;

    }


    if(
        product.user_id !==
        currentUser.id
    ){

        showToast(
            "You can only manage your own products."
        );

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from(
                "marketplace_products"
            )
            .update({

                status:
                    newStatus

            })
            .eq(
                "id",
                product.id
            )
            .eq(
                "user_id",
                currentUser.id
            );


        if(error){

            throw error;

        }


        showToast(
            newStatus === "active"
                ? "Product activated ✓"
                : "Product hidden."
        );


        await loadGlobalProducts();

        await renderMyListings();

    }
    catch(error){

        console.error(
            "Status update error:",
            error
        );


        showToast(
            "Unable to update product: " +
            error.message
        );

    }

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

async function deleteProduct(
    product
){

    if(!requireLogin()){

        return;

    }


    if(
        product.user_id !==
        currentUser.id
    ){

        return;

    }


    const confirmed =
        confirm(
            "Delete \"" +
            product.product_name +
            "\" permanently?"
        );


    if(!confirmed){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from(
                "marketplace_products"
            )
            .delete()
            .eq(
                "id",
                product.id
            )
            .eq(
                "user_id",
                currentUser.id
            );


        if(error){

            throw error;

        }


        showToast(
            "Product deleted."
        );


        await loadGlobalProducts();

        await renderMyListings();

    }
    catch(error){

        console.error(
            "Delete product error:",
            error
        );


        showToast(
            "Unable to delete product: " +
            error.message
        );

    }

}

            mrp_price,
            offer_price,
            location,
            description,
            image_url,
            status,
            views_count,
            likes_count,
            interests_count,
            shares_count,
            whatsapp_clicks_count,
            created_at,
            updated_at
        `)
        .eq(
            "user_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "My listings error:",
            error
        );


        listedProductsContainer.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-circle-exclamation"></i>

                <div class="empty-title">
                    Unable to load your listings
                </div>

                <div class="empty-text">
                    ${escapeHtml(error.message)}
                </div>

            </div>

        `;

        return;

    }


    const myProducts =
        products || [];


    await attachProfiles(
        myProducts
    );


    allMyListings =
        myProducts;


    renderMyListings();

}


/* =========================================================
   MY LISTINGS CACHE
========================================================= */

let allMyListings = [];


/* =========================================================
   RENDER MY LISTINGS
========================================================= */

function renderMyListings(){

    let products =
        allMyListings;


    if(searchText){

        products =
            products.filter(
                product =>
                    matchesSearch(product)
            );

    }


    listedProductsContainer.innerHTML =
        "";


    if(!products.length){

        listedProductsContainer.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-box-open"></i>

                <div class="empty-title">

                    ${
                        searchText
                            ? "No matching listings"
                            : "You have no listings yet"
                    }

                </div>

                <div class="empty-text">

                    ${
                        searchText
                            ? "Try another keyword."
                            : "Use Sell Product to create your first listing."
                    }

                </div>

            </div>

        `;

        return;

    }


    products.forEach(
        product => {

            listedProductsContainer.appendChild(
                createProductCard(
                    product,
                    true
                )
            );

        }
    );

}


/* =========================================================
   LOAD LIKED PRODUCTS
========================================================= */

async function loadLikedProducts(){

    if(!requireLogin()){

        return;

    }


    likedProductsContainer.innerHTML = `

        <div class="loading">

            <i class="fas fa-spinner fa-spin"></i>

            <div>
                Loading liked products...
            </div>

        </div>

    `;


    const {
        data:likes,
        error
    } =
    await supabaseClient
        .from(
            "marketplace_likes"
        )
        .select(
            "product_id"
        )
        .eq(
            "user_id",
            currentUser.id
        );


    if(error){

        console.error(
            "Liked products error:",
            error
        );


        likedProductsContainer.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-circle-exclamation"></i>

                <div class="empty-title">
                    Unable to load liked products
                </div>

            </div>

        `;

        return;

    }


    const productIds =
        (
            likes || []
        ).map(
            item =>
                item.product_id
        );


    if(!productIds.length){

        likedProductsContainer.innerHTML = `

            <div class="empty-state">

                <i class="far fa-heart"></i>

                <div class="empty-title">
                    No liked products yet
                </div>

                <div class="empty-text">
                    Products you like will appear here.
                </div>

            </div>

        `;

        return;

    }


    const {
        data:products,
        error:productError
    } =
    await supabaseClient
        .from(
            "marketplace_products"
        )
        .select(`
            id,
            user_id,
            product_name,
            condition,
            mrp_price,
            offer_price,
            location,
            description,
            image_url,
            status,
            views_count,
            likes_count,
            interests_count,
            shares_count,
            whatsapp_clicks_count,
            created_at,
            updated_at
        `)
        .in(
            "id",
            productIds
        )
        .eq(
            "status",
            "active"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(productError){

        console.error(
            productError
        );

        likedProductsContainer.innerHTML = `

            <div class="empty-state">

                Unable to load liked products.

            </div>

        `;

        return;

    }


    const liked =
        products || [];


    await attachProfiles(
        liked
    );


    likedProductsContainer.innerHTML =
        "";


    const filtered =
        liked.filter(
            product =>
                matchesSearch(product)
        );


    if(!filtered.length){

        likedProductsContainer.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-search"></i>

                <div class="empty-title">
                    No matching liked products
                </div>

            </div>

        `;

        return;

    }


    filtered.forEach(
        product => {

            likedProductsContainer.appendChild(
                createProductCard(
                    product,
                    false
                )
            );

        }
    );

}


/* =========================================================
   CREATE MARKETPLACE NOTIFICATION
========================================================= */

async function createMarketplaceNotification({

    receiverId,
    type,
    message

}){

    try{

        if(
            !receiverId ||
            !currentUser ||
            receiverId ===
            currentUser.id
        ){

            return;

        }


        const {
            error
        } =
        await supabaseClient
            .from(
                "notifications"
            )
            .insert({

                user_id:
                    receiverId,

                sender_id:
                    currentUser.id,

                notification_type:
                    type,

                message:
                    message,

                is_read:
                    false

            });


        if(error){

            /*
               Do not break the actual
               marketplace action if notification
               insertion has a policy issue.
            */

            console.error(
                "Marketplace notification error:",
                error
            );

        }

    }
    catch(error){

        console.error(
            "Marketplace notification exception:",
            error
        );

    }

}

/* =========================================================
   IMAGE PREVIEW
========================================================= */

document.getElementById(
    "productImage"
).addEventListener(
    "change",
    function(){

        const file =
            this.files?.[0];


        if(!file){

            return;

        }


        if(
            file.size >
            5 * 1024 * 1024
        ){

            showToast(
                "Image must be 5 MB or smaller."
            );


            this.value =
                "";

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                const preview =
                    document.getElementById(
                        "imagePreview"
                    );


                preview.src =
                    event.target.result;


                preview.style.display =
                    "block";

            };


        reader.readAsDataURL(
            file
        );

    }
);


/* =========================================================
   UPLOAD PRODUCT IMAGE
========================================================= */

async function uploadProductImage(
    file
){

    if(!file){

        return null;

    }


    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const safeExtension =
        [
            "jpg",
            "jpeg",
            "png",
            "webp"
        ].includes(
            extension
        )
            ? extension
            : "jpg";


    const fileName =
        Date.now() +
        "-" +
        crypto.randomUUID() +
        "." +
        safeExtension;


    /*
       IMPORTANT:

       Storage RLS expects:

       USER_ID / filename
    */

    const filePath =
        currentUser.id +
        "/" +
        fileName;


    const {
        error
    } =
    await supabaseClient
        .storage
        .from(
            "marketplace"
        )
        .upload(
            filePath,
            file,
            {
                cacheControl:
                    "3600",

                upsert:
                    false,

                contentType:
                    file.type
            }
        );


    if(error){

        throw error;

    }


    const {
        data
    } =
    supabaseClient
        .storage
        .from(
            "marketplace"
        )
        .getPublicUrl(
            filePath
        );


    return data.publicUrl;

}


/* =========================================================
   POST PRODUCT
========================================================= */

document.getElementById(
    "postProductBtn"
).addEventListener(
    "click",
    async function(){

        if(!requireLogin()){

            return;

        }


        const productName =
            document.getElementById(
                "productName"
            )
            .value
            .trim();


        const condition =
            document.getElementById(
                "productCondition"
            )
            .value;


        const mrpValue =
            document.getElementById(
                "mrpPrice"
            )
            .value
            .trim();


        const offerValue =
            document.getElementById(
                "offerPrice"
            )
            .value
            .trim();


        const location =
            document.getElementById(
                "productLocation"
            )
            .value
            .trim();


        const description =
            document.getElementById(
                "productDescription"
            )
            .value
            .trim();


        const imageFile =
            document.getElementById(
                "productImage"
            )
            .files?.[0];


        if(
            !productName ||
            !offerValue ||
            !location
        ){

            showToast(
                "Please fill Product Name, Offer Price and Location."
            );

            return;

        }


        const offerPrice =
            Number(
                offerValue
            );


        const mrpPrice =
            mrpValue
                ? Number(
                    mrpValue
                )
                : null;


        if(
            Number.isNaN(
                offerPrice
            ) ||
            offerPrice < 0
        ){

            showToast(
                "Please enter a valid offer price."
            );

            return;

        }


        if(
            mrpPrice !== null &&
            (
                Number.isNaN(
                    mrpPrice
                ) ||
                mrpPrice < 0
            )
        ){

            showToast(
                "Please enter a valid MRP."
            );

            return;

        }


        const button =
            this;


        button.disabled =
            true;


        button.innerHTML = `

            <i class="fas fa-spinner fa-spin"></i>
            Posting...

        `;


        try{

            let imageUrl =
                null;


            if(imageFile){

                imageUrl =
                    await uploadProductImage(
                        imageFile
                    );

            }


            const {
                error
            } =
            await supabaseClient
                .from(
                    "marketplace_products"
                )
                .insert({

                    user_id:
                        currentUser.id,

                    product_name:
                        productName,

                    condition:
                        condition,

                    mrp_price:
                        mrpPrice,

                    offer_price:
                        offerPrice,

                    location:
                        location,

                    description:
                        description ||
                        null,

                    image_url:
                        imageUrl,

                    status:
                        "active"

                });


            if(error){

                throw error;

            }


            showToast(
                "Product posted successfully! 🛒"
            );


            resetSellForm();


            sellForm.style.display =
                "none";


            removeActiveButtons();


            await loadGlobalProducts();


            if(
                listedProducts.style.display ===
                "block"
            ){

                await loadMyListings();

            }

        }
        catch(error){

            console.error(
                "Post product error:",
                error
            );


            showToast(
                "Unable to post product: " +
                error.message
            );

        }
        finally{

            button.disabled =
                false;

            button.innerHTML = `

                <i class="fas fa-paper-plane"></i>
                Post Product

            `;

        }

    }
);

/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient
    .auth
    .onAuthStateChange(
        async function(
            event,
            session
        ){

            if(
                session?.user
            ){

                currentUser =
                    session.user;


                await loadCurrentUser();

                await loadGlobalProducts();

            }
            else{

                currentUser =
                    null;

                currentProfile =
                    null;

                await loadGlobalProducts();

            }

        }
    );


/* =========================================================
   INITIALIZE
========================================================= */

async function initializeMarketplace(){

    await loadCurrentUser();

    await loadGlobalProducts();

}


initializeMarketplace();


/* =========================================================
   PERIODIC REFRESH
========================================================= */

setInterval(
    async function(){

        /*
           Keep global active listings reasonably fresh.
        */

        await loadGlobalProducts();


        if(
            listedProducts.style.display ===
            "block" &&
            currentUser
        ){

            await loadMyListings();

        }


        if(
            likedProducts.style.display ===
            "block" &&
            currentUser
        ){

            await loadLikedProducts();

        }

    },
    30000
);
