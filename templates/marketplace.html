<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pathukkalam Marketplace</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f0f2f5;
    padding-bottom:120px;
    color:#222;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    background:#1877f2;
    color:white;
    padding:18px;
    font-size:24px;
    font-weight:bold;
    position:sticky;
    top:0;
    z-index:1000;
    text-align:center;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{
    background:white;
    padding:15px;
    position:sticky;
    top:66px;
    z-index:999;
}

.search-wrapper{
    display:flex;
    align-items:center;
    gap:10px;
    background:#f0f2f5;
    border-radius:14px;
    padding:0 14px;
}

.search-wrapper i{
    color:#777;
}

.search-box input{
    width:100%;
    padding:15px 5px;
    border:none;
    background:transparent;
    outline:none;
    font-size:15px;
}


/* =========================================================
   TOP BUTTONS
========================================================= */

.top-action{
    padding:0 15px;
    display:flex;
    gap:10px;
    margin-top:14px;
}

.top-btn{
    flex:1;
    padding:18px 10px;
    border:none;
    background:#1877f2;
    color:white;
    border-radius:18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.top-btn.active{
    background:#ffb400;
    color:black;
    transform:scale(1.02);
}

.top-btn:active{
    transform:scale(.98);
}


/* =========================================================
   SELL FORM
========================================================= */

.sell-form{
    background:white;
    margin:15px;
    padding:18px;
    border-radius:18px;
    display:none;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.form-title{
    font-size:22px;
    font-weight:bold;
    color:#1877f2;
    margin-bottom:15px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:14px;
    font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:13px;
    border:none;
    background:#f0f2f5;
    border-radius:12px;
    outline:none;
    font-size:14px;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    outline:2px solid rgba(24,119,242,.15);
}

textarea{
    resize:none;
    height:90px;
}

.btn-group{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.post-btn,
.draft-btn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.post-btn{
    background:#1877f2;
    color:white;
}

.draft-btn{
    background:#ddd;
    color:#333;
}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

.image-preview{
    display:none;
    margin-top:10px;
}

.image-preview img{
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:12px;
}


/* =========================================================
   SECTION
========================================================= */

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 15px 5px;
}

.section-title{
    font-size:22px;
    font-weight:bold;
    color:#1877f2;
}

.section-subtitle{
    margin:0 15px 15px;
    color:gray;
    font-size:14px;
}


/* =========================================================
   PRODUCT
========================================================= */

.product{
    background:white;
    margin:15px;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product-image{
    position:relative;
}

.product img.product-main-image{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
}

.product-details{
    padding:15px;
}

.product-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.product-description{
    color:#555;
    font-size:13px;
    line-height:1.5;
    margin-top:8px;
}

.condition{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:10px;
}

.new{
    background:#e7f8ea;
    color:green;
}

.used{
    background:#fff4e5;
    color:#ff8800;
}

.rebuild{
    background:#e8f1ff;
    color:#1877f2;
}


/* =========================================================
   PRICE
========================================================= */

.price-row{
    margin-top:8px;
}

.mrp{
    text-decoration:line-through;
    color:gray;
    margin-right:10px;
}

.offer{
    color:green;
    font-size:22px;
    font-weight:bold;
}


/* =========================================================
   LOCATION
========================================================= */

.location{
    margin-top:10px;
    color:#666;
    font-size:14px;
}


/* =========================================================
   SELLER
========================================================= */

.seller-box{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
    padding:10px;
    background:#f7f8fa;
    border-radius:12px;
    cursor:pointer;
}

.seller-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
}

.seller-info{
    flex:1;
    min-width:0;
}

.seller-name{
    font-size:14px;
    font-weight:bold;
}

.seller-username{
    color:#888;
    font-size:12px;
    margin-top:3px;
}

.seller-arrow{
    color:#1877f2;
}


/* =========================================================
   STATS
========================================================= */

.product-stats{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-top:12px;
    color:#777;
    font-size:12px;
}

.product-stats span{
    display:flex;
    align-items:center;
    gap:4px;
}


/* =========================================================
   ACTION ROW
========================================================= */

.action-row{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:18px;
}

.view-btn{
    flex:1;
    padding:13px;
    border:none;
    background:#1877f2;
    color:white;
    border-radius:12px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.interested-btn{
    flex:1;
    padding:13px;
    border:none;
    background:#00a86b;
    color:white;
    border-radius:12px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.interested-btn.interested{
    background:#00834f;
}


/* =========================================================
   ICON BUTTONS
========================================================= */

.icon-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    color:white;
    flex-shrink:0;
}

.like-btn{
    background:#ff4d6d;
}

.like-btn.liked{
    background:#00a86b;
}

.share-btn{
    background:#ffb400;
    color:black;
}

.whatsapp-btn{
    background:#25d366;
}


/* =========================================================
   OWNER CONTROLS
========================================================= */

.owner-controls{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid #eee;
}

.owner-title{
    font-size:13px;
    font-weight:bold;
    margin-bottom:10px;
    color:#1877f2;
}

.owner-buttons{
    display:flex;
    gap:8px;
}

.owner-btn{
    flex:1;
    padding:11px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.hide-btn{
    background:#eee;
    color:#555;
}

.activate-btn{
    background:#e7f8ea;
    color:#00834f;
}

.delete-btn{
    background:#ffe3e3;
    color:#c62828;
}


/* =========================================================
   STATUS
========================================================= */

.status-badge{
    position:absolute;
    top:12px;
    left:12px;
    padding:7px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.status-active{
    background:#e7f8ea;
    color:#00834f;
}

.status-hidden{
    background:#eee;
    color:#666;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-state{
    text-align:center;
    padding:50px 20px;
    color:#888;
}

.empty-state i{
    font-size:42px;
    color:#bbb;
    margin-bottom:12px;
}

.empty-title{
    font-size:17px;
    font-weight:bold;
    color:#555;
}

.empty-text{
    font-size:13px;
    margin-top:7px;
    line-height:1.5;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    text-align:center;
    padding:45px;
    color:#777;
}

.loading i{
    font-size:25px;
    margin-bottom:10px;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:white;
    padding:12px 18px;
    border-radius:25px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:10000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    .header{
        font-size:20px;
    }

    .top-action{
        gap:6px;
        padding:0 10px;
    }

    .top-btn{
        font-size:12px;
        padding:15px 5px;
    }

    .product{
        margin:10px;
    }

    .action-row{
        flex-wrap:wrap;
    }

    .view-btn,
    .interested-btn{
        min-width:120px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<div class="header">

    🛒 Pathukkalam Marketplace

</div>


<!-- =======================================================
     SEARCH
======================================================= -->

<div class="search-box">

    <div class="search-wrapper">

        <i class="fas fa-search"></i>

        <input
            type="text"
            id="searchInput"
            placeholder="Search product, seller, location, description..."
            autocomplete="off">

    </div>

</div>


<!-- =======================================================
     TOP BUTTONS
======================================================= -->

<div class="top-action">

    <button
        class="top-btn"
        id="sellBtn">

        ➕ Sell Product

    </button>


    <button
        class="top-btn"
        id="listedBtn">

        📦 My Listings

    </button>


    <button
        class="top-btn"
        id="likedBtn">

        ❤️ Liked

    </button>

</div>


<!-- =======================================================
     SELL FORM
======================================================= -->

<div
    class="sell-form"
    id="sellForm">


    <div class="form-title">

        <i class="fas fa-box"></i>
        Create Product Post

    </div>


    <!-- PRODUCT NAME -->

    <div class="form-group">

        <label>
            Product Name *
        </label>

        <input
            type="text"
            id="productName"
            placeholder="iPhone 14">

    </div>


    <!-- CONDITION -->

    <div class="form-group">

        <label>
            Product Condition
        </label>

        <select id="productCondition">

            <option value="New">
                🟢 New
            </option>

            <option value="Used">
                🟠 Used
            </option>

            <option value="Rebuild">
                🔵 Rebuild
            </option>

        </select>

    </div>


    <!-- MRP -->

    <div class="form-group">

        <label>
            MRP Price

    </div>


    <!-- OFFER -->

    <div class="form-group">

        <label>

        </label>

        <input
            type="number"

            min="0">

    </div>


    <!-- LOCATION -->

    <div class="form-group">

        <label>
            Location *
        </label>

        <input
            type="text"
            id="productLocation"
            placeholder="Chennai">

    </div>


    <!-- DESCRIPTION -->

    <div class="form-group">

        <label>
            Description
        </label>

        <textarea
            id="productDescription"

    </div>


    <!-- IMAGE -->

    <div class="form-group">

        <label>

        <input

            accept="image/*">

        <div
            class="image-preview"

            <img
                id="previewImage"

    </div>


    <div class="btn-group">

        <button
            class="post-btn"

            <i class="fas fa-paper-plane"></i>
            Post Product

        </button>


        <button
            class="draft-btn"
            id="cancelSellBtn">

            Cancel

        </button>

    </div>

</div>


<!-- =======================================================
     MAIN GLOBAL MARKETPLACE
======================================================= -->

<div
    id="globalSection">


    <div class="section-header">

        <div class="section-title">

            🛍️ Marketplace

        </div>


        <button
            class="icon-btn"
            id="refreshBtn"
            style="
                width:40px;
                height:40px;
                background:white;
                color:#1877f2;
                box-shadow:0 2px 5px rgba(0,0,0,.08);
            ">

            <i class="fas fa-rotate"></i>

        </button>

    </div>


    <div
        class="section-subtitle">

        Latest products from Pathukkalam users

    </div>


    <div
        id="globalProductsContainer">

    </div>

</div>


<!-- =======================================================
     MY LISTINGS
======================================================= -->

<div
    class="my-listed-section"
    id="listedProducts"
    style="display:none;">

    <div class="section-header">

        <div class="section-title">

            📦 My Listed Products

        </div>

    </div>


    <div class="section-subtitle">

        Manage products posted by you.
        Hidden products are not visible to other users.

    </div>


    <div
        id="myProductsContainer">

    </div>

</div>


<!-- =======================================================
     LIKED PRODUCTS
======================================================= -->

<div
    class="liked-products-section"
    id="likedProducts"
    style="display:none;">

    <div class="section-header">

        <div class="section-title">

            ❤️ Products Liked By Me

        </div>

    </div>


    <div class="section-subtitle">

        Products you have liked

    </div>


    <div
        id="likedProductsContainer">

    </div>

</div>


<!-- =======================================================
     TOAST
======================================================= -->

<div
    class="toast"
    id="toast">

</div>


<!-- =======================================================
     SUPABASE
======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://jxpvkamxtedgzztozonl.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_DCI0qvAlYNBpWi8DZkZF2g_frSEW_OX";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let currentProfile = null;

let allProducts = [];

let myLikedProductIds = new Set();

let currentMode = "global";

let searchText = "";


/* =========================================================
   ELEMENTS
========================================================= */

const globalProductsContainer =
    document.getElementById(
        "globalProductsContainer"
    );

const myProductsContainer =
    document.getElementById(
        "myProductsContainer"
    );

const likedProductsContainer =
    document.getElementById(
        "likedProductsContainer"
    );

const globalSection =
    document.getElementById(
        "globalSection"
    );

const listedProducts =
    document.getElementById(
        "listedProducts"
    );

const likedProducts =
    document.getElementById(
        "likedProducts"
    );

const sellForm =
    document.getElementById(
        "sellForm"
    );


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.innerText =
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(
        function(){

            toast.classList.remove(
                "show"
            );

        },
        3000
    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


/* =========================================================
   LOGIN CHECK
========================================================= */

async function loadCurrentUser(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(
        error ||
        !data.user
    ){

        currentUser =
            null;

        currentProfile =
            null;

        return false;

    }


    currentUser =
        data.user;


    const {
        data:profile,
        error:profileError
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            name,
            profile_url
        `)
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if(profileError){

        console.error(
            "Profile loading error:",
            profileError
        );

    }


    currentProfile =
        profile || null;


    return true;

}


/* =========================================================
   REQUIRE LOGIN
========================================================= */

function requireLogin(){

    if(currentUser){

        return true;

    }


    const currentPath =
        window.location.pathname +
        window.location.search;


    window.location.href =
        "/login?next=" +
        encodeURIComponent(
            currentPath
        );


    return false;

}


/* =========================================================
   LOAD GLOBAL PRODUCTS
========================================================= */

async function loadGlobalProducts(){

    globalProductsContainer.innerHTML = `

        <div class="loading">

            <i class="fas fa-spinner fa-spin"></i>

            <div>
                Loading marketplace...
            </div>

        </div>

    `;


    /*
     * Only ACTIVE products appear
     * in the public marketplace.
     */

    const {
        data,
        error
    } =
    await supabaseClient
        .from("marketplace_products")
        .select(`
            id,
            user_id,
            product_name,
            condition,
            mrp_price,
            offer_price,
            location,
            description,
            image_url,
            status,
            views_count,
            likes_count,
            interests_count,
            shares_count,
            whatsapp_clicks_count,
            created_at
        `)
        .eq(
            "status",
            "active"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Marketplace loading error:",
            error
        );


        globalProductsContainer.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-circle-exclamation"></i>

                <div class="empty-title">
                    Unable to load marketplace
                </div>

                <div class="empty-text">
                    ${escapeHtml(error.message)}
                </div>

            </div>

        `;

        return;

    }


    allProducts =
        data || [];


    await attachProductProfiles(
        allProducts
    );

}


/* =========================================================
   ATTACH SELLER PROFILES
========================================================= */

async function attachProductProfiles(
    products
){

    const ids =
        [
            ...new Set(
                products
                    .map(
                        product =>
                            product.user_id
                    )
                    .filter(Boolean)
            )
        ];


    if(!ids.length){

        await loadMyLikes();

        renderGlobalProducts();

        return;

    }


    const {
        data:profiles,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            name,
            profile_url
        `)
        .in(
            "id",
            ids
        );


    if(error){

        console.error(
            "Seller profile error:",
            error
        );

    }


    const profileMap =
        new Map();


    (
        profiles || []
    ).forEach(
        profile => {

            profileMap.set(
                profile.id,
                profile
            );

        }
    );


    allProducts =
        products.map(
            product => {

                return {

                    ...product,

                    seller:
                        profileMap.get(
                            product.user_id
                        ) || null

                };

            }
        );


    await loadMyLikes();

    renderGlobalProducts();

}


/* =========================================================
   LOAD MY LIKES
========================================================= */

async function loadMyLikes(){

    myLikedProductIds =
        new Set();


    if(!currentUser){

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("marketplace_likes")
        .select(
            "product_id"
        )
        .eq(
            "user_id",
            currentUser.id
        );


    if(error){

        console.error(
            "Likes loading error:",
            error
        );

        return;

    }


    (
        data || []
    ).forEach(
        row => {

            myLikedProductIds.add(
                Number(
                    row.product_id
                )
            );

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    function(){

        searchText =
            this.value
                .trim()
                .toLowerCase();


        if(
            currentMode ===
            "global"
        ){

            renderGlobalProducts();

        }
        else if(
            currentMode ===
            "listed"
        ){

            renderMyProducts();

        }
        else if(
            currentMode ===
            "liked"
        ){

            renderLikedProducts();

        }

    }
);


/* =========================================================
   SEARCH MATCH
========================================================= */

function productMatchesSearch(
    product
){

    if(!searchText){

        return true;

    }


    /*
     * Partial matching.
     *
     * Example:
     *
     * "iphone"
     * matches
     * "Apple iPhone 14 Pro"
     *
     * "chen"
     * matches
     * "Chennai"
     *
     * "sudha"
     * matches
     * "Sudhakar"
     *
     * No complete-word requirement.
     */

    const text =
        [

            product.product_name,

            product.description,

            product.location,

            product.condition,

            product.seller?.name,

            product.seller?.username

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


    return text.includes(
        searchText
    );

}


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(
    value
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "";

    }


    return "₹" +
        Number(
            value
        ).toLocaleString(
            "en-IN"
        );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    value
){

    if(!value){

        return "";

    }


    try{

        return new Date(
            value
        ).toLocaleString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }
    catch{

        return "";

    }

}


/* =========================================================
   CONDITION CLASS
========================================================= */

function getConditionClass(
    condition
){

    const value =
        String(
            condition || ""
        ).toLowerCase();


    if(value === "new"){

        return "new";

    }


    if(value === "used"){

        return "used";

    }


    return "rebuild";

}


/* =========================================================
   CONDITION ICON
========================================================= */

function getConditionIcon(
    condition
){

    const value =
        String(
            condition || ""
        ).toLowerCase();


    if(value === "new"){

        return "🟢";

    }


    if(value === "used"){

        return "🟠";

    }


    return "🔵";

}

                <div class="empty-title">

/* =========================================================
   OPEN PRODUCT
========================================================= */

async function openProduct(
    product
){

    /*
     * Register a view only when
     * someone actually opens/views it.
     */

    await registerProductView(
        product
    );


    /*
     * For now show product information
     * in a simple alert.
     *
     * Later this can become:
     * /marketplace/<product_id>
     */

    alert(
        product.product_name +
        "\n\n" +

        "Listed by: " +
        (
            product.seller?.name ||
            product.seller?.username ||
            "Pathukkalam User"
        ) +

        "\n\n" +

        "Price: " +
        formatPrice(
            product.offer_price
        ) +

        "\n\n" +

        (
            product.description ||
            "No description available."
        )
    );

}


/* =========================================================
   REGISTER VIEW
========================================================= */

async function registerProductView(
    product
){

    /*
     * Don't count owner's own view.
     */

    if(
        !currentUser ||
        product.user_id ===
        currentUser.id
    ){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from("marketplace_views")
            .insert({

                product_id:
                    product.id,

                user_id:
                    currentUser.id

            });


        if(error){

            console.error(
                "View tracking error:",
                error
            );

            return;

        }


        /*
         * Increment cached counter.
         */

        await supabaseClient
            .from("marketplace_products")
            .update({

                views_count:
                    Number(
                        product.views_count || 0
                    ) + 1

            })
            .eq(
                "id",
                product.id
            );


        product.views_count =
            Number(
                product.views_count || 0
            ) + 1;


    }
    catch(error){

        console.error(
            error
        );

    }

}


/* =========================================================
   LIKE / UNLIKE
========================================================= */

async function toggleLike(
    product,
    button
){

    if(!requireLogin()){

        return;

    }


    const productId =
        Number(
            product.id
        );


    const alreadyLiked =
        myLikedProductIds.has(
            productId
        );


    button.disabled =
        true;


    try{

        if(alreadyLiked){

            const {
                error
            } =
            await supabaseClient
                .from("marketplace_likes")
                .delete()
                .eq(
                    "product_id",
                    productId
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


            if(error){

                throw error;

            }


            myLikedProductIds.delete(
                productId
            );


            product.likes_count =
                Math.max(
                    0,
                    Number(
                        product.likes_count || 0
                    ) - 1
                );


            await supabaseClient
                .from("marketplace_products")
                .update({

                    likes_count:
                        product.likes_count

                })
                .eq(
                    "id",
                    productId
                );


            button.classList.remove(
                "liked"
            );


            showToast(
                "Removed from liked products."
            );

        }
        else{

            const {
                error
            } =
            await supabaseClient
                .from("marketplace_likes")
                .insert({

                    product_id:
                        productId,

                    user_id:
                        currentUser.id

                });


            if(error){

                throw error;

            }


            myLikedProductIds.add(
                productId
            );


            product.likes_count =
                Number(
                    product.likes_count || 0
                ) + 1;


            await supabaseClient
                .from("marketplace_products")
                .update({

                    likes_count:
                        product.likes_count

                })
                .eq(
                    "id",
                    productId
                );


            button.classList.add(
                "liked"
            );


            /*
             * Notify seller.
             */

            await createMarketplaceNotification({

                receiverId:
                    product.user_id,

                type:
                    "marketplace_like",

                message:
                    (
                        currentProfile?.name ||
                        currentProfile?.username ||
                        "Someone"
                    ) +
                    " liked your product \"" +
                    product.product_name +
                    "\"."

            });


            showToast(
                "Product liked ❤️"
            );

        }


        if(
            currentMode ===
            "global"
        ){

            renderGlobalProducts();

        }

    }
    catch(error){

        console.error(
            "Like error:",
            error
        );


        showToast(
            "Unable to update like: " +
            error.message
        );

    }
    finally{

        button.disabled =
            false;

    }

}

            error:checkError
        } =
        await supabaseClient
            .from("marketplace_interests")
            .select(
                "id"
            )
            .eq(
                "product_id",
                product.id
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


        if(checkError){

            throw checkError;

        }


        if(existing){

            showToast(
                "You already showed interest."
            );

            return;

        }


        const {
            error
        } =
        await supabaseClient
            .from("marketplace_interests")
            .insert({

                product_id:
                    product.id,

                user_id:
                    currentUser.id

            });


        if(error){

            throw error;

        }


        product.interests_count =
            Number(
                product.interests_count || 0
            ) + 1;


        await supabaseClient
            .from("marketplace_products")
            .update({

                interests_count:
                    product.interests_count

            })
            .eq(
                "id",
                product.id
            );


        button.classList.add(
            "interested"
        );


        button.innerText =
            "✓ Interested";


        /*
         * Notify seller.
         */

        await createMarketplaceNotification({

            receiverId:
                product.user_id,

            type:
                "marketplace_interest",

            message:
                (
                    currentProfile?.name ||
                    currentProfile?.username ||
                    "Someone"
                ) +
                " is interested in your product \"" +
                product.product_name +
                "\"."

        });


        showToast(
            "Interest sent successfully! ✓"
        );

    }
    catch(error){

        console.error(
            "Interest error:",
            error
        );


        showToast(
            "Unable to send interest: " +
            error.message
        );

    }
    finally{

        button.disabled =
            false;

    }

}


/* =========================================================
   SHARE
========================================================= */

async function shareProduct(
    product
){

    const url =
        window.location.origin +
        "/marketplace/" +
        product.id;


    const text =
        product.product_name +
        " - " +
        formatPrice(
            product.offer_price
        ) +
        "\n" +
        url;


    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    product.product_name,

                text:
                    text,

                url:
                    url

            });

        }
        else{

            await navigator.clipboard.writeText(
                text
            );

            showToast(
                "Product link copied!"
            );

        }


        /*
         * Count share after successful
         * share/copy action.
         */

        if(
            currentUser &&
            product.user_id !==
            currentUser.id
        ){

            await supabaseClient
                .from("marketplace_shares")
                .insert({

                    product_id:
                        product.id,

                    user_id:
                        currentUser.id

                });


            product.shares_count =
                Number(
                    product.shares_count || 0
                ) + 1;


            await supabaseClient
                .from("marketplace_products")
                .update({

                    shares_count:
                        product.shares_count

                })
                .eq(
                    "id",
                    product.id
                );


            await createMarketplaceNotification({

                receiverId:
                    product.user_id,

                type:
                    "marketplace_share",

                message:
                    (
                        currentProfile?.name ||
                        currentProfile?.username ||
                        "Someone"
                    ) +
                    " shared your product \"" +
                    product.product_name +
                    "\"."

            });

        }

    }
    catch(error){

        /*
         * User cancelled share.
         */

        console.log(
            "Share cancelled or failed:",
            error
        );

    }

}

async function whatsappProduct(

){

    const message =
        "Hi " +
        sellerName +
        ", I am interested in your Pathukkalam Marketplace product:\n\n" +

        product.product_name +
        "\n" +

        "Price: " +
        formatPrice(
            product.offer_price
        ) +
        "\n" +

        "Location: " +
        product.location;


    /*
     * Register click before opening
     * WhatsApp.
     */

    if(
        currentUser &&
        product.user_id !==
        currentUser.id
    ){

        try{

            await supabaseClient
                .from("marketplace_whatsapp_clicks")
                .insert({

                    product_id:
                        product.id,

                    user_id:
                        currentUser.id

                });


            product.whatsapp_clicks_count =
                Number(
                    product.whatsapp_clicks_count || 0
                ) + 1;


            await supabaseClient
                .from("marketplace_products")
                .update({

                    whatsapp_clicks_count:
                        product.whatsapp_clicks_count

                })
                .eq(
                    "id",
                    product.id
                );


            await createMarketplaceNotification({

                receiverId:
                    product.user_id,

                type:
                    "marketplace_whatsapp",

                message:
                    (
                        currentProfile?.name ||
                        currentProfile?.username ||
                        "Someone"
                    ) +
                    " clicked WhatsApp for your product \"" +
                    product.product_name +
                    "\"."

            });

        }
        catch(error){

            );

        }

    /*

/* =========================================================
   OWNER: UPDATE STATUS
========================================================= */

async function updateProductStatus(
    product,
    newStatus
){

    if(!requireLogin()){

        return;

    }


    if(
        product.user_id !==
        currentUser.id
    ){

        showToast(
            "You can only manage your own listings."
        );

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from("marketplace_products")
            .update({

                status:
                    newStatus

            })
            .eq(
                "id",
                product.id
            )
            .eq(
                "user_id",
                currentUser.id
            );


        if(error){

            throw error;

        }


        showToast(
            newStatus === "active"
                ? "Listing activated ✓"
                : "Listing hidden."
        );


        await loadGlobalProducts();

        await loadMyProducts();

    }
    catch(error){

        console.error(
            "Status update error:",
            error
        );


        showToast(
            "Unable to update listing: " +
            error.message
        );

    }

}


/* =========================================================
   OWNER: DELETE
========================================================= */

async function deleteProduct(
    product
){

    if(!requireLogin()){

        return;

    }


    if(
        product.user_id !==
        currentUser.id
    ){

        return;

    }


    const confirmed =
        confirm(
            "Delete \"" +
            product.product_name +
            "\" permanently?"
        );


    if(!confirmed){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from("marketplace_products")
            .delete()
            .eq(
                "id",
                product.id
            )
            .eq(
                "user_id",
                currentUser.id
            );


        if(error){

            throw error;

        }


        showToast(
            "Product deleted."
        );


        await loadGlobalProducts();

        await loadMyProducts();

    }
    catch(error){

        console.error(
            "Delete product error:",
            error
        );


        showToast(
            "Unable to delete product: " +
            error.message
        );

    }

}


/* =========================================================
   NOTIFICATION
========================================================= */

async function createMarketplaceNotification({
    receiverId,
    type,
    message
}){

    if(
        !currentUser ||
        !receiverId ||
        receiverId ===
        currentUser.id
    ){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from("notifications")
            .insert({

                user_id:
                    receiverId,

                sender_id:
                    currentUser.id,

                notification_type:
                    type,

                message:
                    message,

                is_read:
                    false

            });


        if(error){

            console.error(
                "Notification error:",
                error
            );

        }

    }
    catch(error){

        console.error(
            "Notification exception:",
            error
        );

    }

}

/* =========================================================
   POST PRODUCT
========================================================= */

document.getElementById(
    "postProductBtn"
).addEventListener(
    "click",
    async function(){

        if(!requireLogin()){

            return;

        }


        const button =
            this;


        const productName =
            document.getElementById(
                "productName"
            ).value.trim();


        const condition =
            document.getElementById(
                "productCondition"
            ).value;


        const mrpPrice =
            document.getElementById(
                "mrpPrice"
            ).value;


        const offerPrice =
            document.getElementById(
                "offerPrice"
            ).value;


        const location =
            document.getElementById(
                "productLocation"
            ).value.trim();


        const description =
            document.getElementById(
                "productDescription"
            ).value.trim();


        const imageFile =
            document.getElementById(
                "productImage"
            ).files[0];


        if(
            !productName ||
            !offerPrice ||
            !location
        ){

            alert(
                "Please fill Product Name, Offer Price and Location."
            );

            return;

        }


        button.disabled =
            true;


        button.innerHTML = `

            <i class="fas fa-spinner fa-spin"></i>

            Posting...

        `;


        try{

            let imageUrl =
                null;


            /* =================================================
               IMAGE UPLOAD
            ================================================= */

            if(imageFile){

                const extension =
                    imageFile.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                const fileName =
                    currentUser.id +
                    "_" +
                    Date.now() +
                    "." +
                    extension;


                const filePath =
                    "marketplace/" +
                    fileName;


                const {
                    error:uploadError
                } =
                await supabaseClient
                    .storage
                    .from(
                        "marketplace"
                    )
                    .upload(
                        filePath,
                        imageFile,
                        {
                            upsert:false
                        }
                    );


                if(uploadError){

                    throw uploadError;

                }


                const {
                    data:publicData
                } =
                supabaseClient
                    .storage
                    .from(
                        "marketplace"
                    )
                    .getPublicUrl(
                        filePath
                    );


                imageUrl =
                    publicData.publicUrl;

            }


            /* =================================================
               INSERT PRODUCT
            ================================================= */

            const {
                error
            } =
            await supabaseClient
                .from(
                    "marketplace_products"
                )
                .insert({

                    user_id:
                        currentUser.id,

                    product_name:
                        productName,

                    condition:
                        condition,

                    mrp_price:
                        mrpPrice
                            ? Number(
                                mrpPrice
                              )
                            : null,

                    offer_price:
                        Number(
                            offerPrice
                        ),

                    location:
                        location,

                    description:
                        description ||
                        null,

                    image_url:
                        imageUrl,

                    status:
                        "active",

                    views_count:
                        0,

                    likes_count:
                        0,

                    interests_count:
                        0,

                    shares_count:
                        0,

                    whatsapp_clicks_count:
                        0

                });


            if(error){

                throw error;

            }


            showToast(
                "Product posted successfully! 🛒"
            );


            /* =================================================
               RESET FORM
            ================================================= */

            document.getElementById(
                "productName"
            ).value = "";


            document.getElementById(
                "mrpPrice"
            ).value = "";


            document.getElementById(
                "offerPrice"
            ).value = "";


            document.getElementById(
                "productLocation"
            ).value = "";


            document.getElementById(
                "productDescription"
            ).value = "";


            document.getElementById(
                "productImage"
            ).value = "";


            document.getElementById(
                "imagePreview"
            ).style.display =
                "none";


            sellForm.style.display =
                "none";


            removeActiveButtons();


            await loadGlobalProducts();

        }
        catch(error){

            console.error(
                "Post product error:",
                error
            );


            alert(
                "Unable to post product:\n\n" +
                error.message
            );

        }
        finally{

            button.disabled =
                false;


            button.innerHTML = `

                <i class="fas fa-paper-plane"></i>

                Post Product

            `;

        }

    }
);


/* =========================================================
   IMAGE PREVIEW
========================================================= */

document.getElementById(
    "productImage"
).addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file){

            document.getElementById(
                "imagePreview"
            ).style.display =
                "none";

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                document.getElementById(
                    "previewImage"
                ).src =
                    event.target.result;


                document.getElementById(
                    "imagePreview"
                ).style.display =
                    "block";

            };


        reader.readAsDataURL(
            file
        );

    }
);

   REFRESH

).addEventListener(

/* =========================================================
   PERIODIC REFRESH
========================================================= */

setInterval(
    async function(){

        await loadCurrentUser();


        if(
            currentMode ===
            "global"
        ){

            await loadGlobalProducts();

        }
        else if(
            currentMode ===
            "listed" &&
            currentUser
        ){

            await loadMyProducts();

        }
        else if(
            currentMode ===
            "liked" &&
            currentUser
        ){

            await loadLikedProducts();

        }

    },
    30000
);


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient
    .auth
    .onAuthStateChange(
        async function(
            event,
            session
        ){

            console.log(
                "Marketplace auth:",
                event
            );


            currentUser =
                session?.user ||
                null;


            if(currentUser){

                await loadCurrentUser();

                await loadMyLikes();

                if(
                    currentMode ===
                    "global"
                ){

                    renderGlobalProducts();

                }

            }

        }
    );

initializeMarketplace();
